 mentalText:"Each space is a transformation of RGB. The choice depends on the task: segmentation, compression, or perceptual comparison.",
 steps:["Choose a colour space for the task.","Convert from RGB.","Operate in that space.","Convert back if needed."],
 pseudo:"RGB -> HSV:\n  max = max(R, G, B), min = min(R, G, B)\n  V = max\n  S = (max - min) / max  (0 if max = 0)\n  H depends on which channel is max\n\nRGB -> grayscale (ITU-R BT.601):\n  Y = 0.299 R + 0.587 G + 0.114 B\n\nRGB -> grayscale (BT.709, sRGB):\n  Y = 0.2126 R + 0.7152 G + 0.0722 B\n\nRGB -> YCbCr (BT.601):\n  Y  =  0.299 R + 0.587 G + 0.114 B\n  Cb = -0.169 R - 0.331 G + 0.500 B + 128\n  Cr =  0.500 R - 0.419 G - 0.081 B + 128\n\nRGB -> CIELAB:\n  linearise sRGB (gamma decode)\n  convert to XYZ\n  apply f(t) = t^(1/3) if t > eps else ...\n  L = 116 f(Y/Yn) - 16\n  a = 500 (f(X/Xn) - f(Y/Yn))\n  b = 200 (f(Y/Yn) - f(Z/Zn))\n\nUse cases:\n  HSV  : colour segmentation, hue-based masks\n  Lab  : perceptual difference, colour transfer\n  YCbCr: JPEG compression, chroma subsampling",
 uses:"Segmentation, colour correction, compression, perceptual metrics.",
 strength:"Task-specific spaces make operations easier and more meaningful.",
 limits:"Conversions are lossy in 8-bit. Gamut differs between spaces.",
 pitfall:"Assuming RGB is perceptually uniform. It is not. Use Lab for perceptual difference.",
 question:"Why does JPEG use YCbCr?",
 answer:"The human visual system is more sensitive to luma than chroma. YCbCr lets JPEG subsample chroma aggressively without visible loss.",
 demo:"color-spaces",sample:"200 120 60\n1",refs:[
  ["Fairchild, Color Appearance Models, 3rd ed., Wiley 2013","https://www.wiley.com/en-us/Color+Appearance+Models%2C+3rd+Edition-p-9781119967033"],
  ["Poynton, Digital Video and HD: Algorithms and Interfaces, 2nd ed., Morgan Kaufmann 2012","https://www.elsevier.com/books/digital-video-and-hd/poynton/978-0-12-391926-7"],
  ["scikit-image color conversion","https://scikit-image.org/docs/stable/api/skimage.color.html"]]},
{id:"sampling-aliasing",title:"Sampling, aliasing and the Nyquist limit",level:3,kind:"Foundation",status:"Runnable teaching lab",
 summary:"Sampling converts a continuous signal into discrete samples. The Nyquist-Shannon theorem says you must sample at more than twice the highest frequency. Below that, aliasing appears as moiré and jaggies.",
 mental:"A grid laid over a continuous scene",
 mentalText:"If the grid is too coarse, high-frequency detail folds into low frequencies. Anti-aliasing filters before sampling to prevent this.",
 steps:["Identify the highest frequency in the signal.","Sample above the Nyquist rate.","Filter before downsampling.","Reconstruct with the appropriate kernel."],
 pseudo:"Nyquist-Shannon:\n  sample rate fs > 2 * f_max\n  otherwise aliasing: high frequencies fold to low frequencies\n\nDownsampling by factor k:\n  naive: keep every k-th sample  -> aliased\n  correct: low-pass filter, then keep every k-th sample\n\nAliasing examples:\n  moiré on fine textures\n  jaggies on diagonal lines\n  wagon-wheel effect in video\n\nAnti-aliasing filters:\n  Gaussian with sigma ~ 0.5 * k\n  Lanczos, Mitchell, box\n\nSupersampling:\n  render at kx resolution, average down\n\nReconstruction:\n  ideal: sinc\n  practical: bilinear, bicubic, Lanczos\n  nearest: no interpolation, blocky",
 uses:"Camera sensors, image resizing, texture mapping, video.",
 strength:"Nyquist gives the exact condition for lossless reconstruction.",
 limits:"Real signals are not band-limited. Practical anti-aliasing is a trade-off.",
 pitfall:"Downsampling without a low-pass filter. Aliasing is irreversible.",
 question:"What happens if you sample below the Nyquist rate?",
 answer:"High frequencies alias to low frequencies. The result is a different signal that passes through the same samples.",
 demo:"sampling",sample:"256\n64\n2",refs:[
  ["Nyquist, Certain topics in telegraph transmission theory, AIEE 1928","https://doi.org/10.1109/T-AIEE.1928.5055024"],
  ["Shannon, Communication in the presence of noise, Proc. IRE 1949","https://doi.org/10.1109/JRPROC.1949.232969"],
  ["Gonzalez and Woods, Digital Image Processing, Chapter 4","https://www.pearson.com/en-us/subject-catalog/p/digital-image-processing/P200000003308"]]},
/* Ch 2 */
{id:"convolution",title:"Convolution and basic filters",level:2,kind:"Filtering",status:"Runnable teaching lab",
 summary:"Convolution slides a kernel over the image, computing a weighted sum at each position. Box, Gaussian and derivative kernels are the building blocks of filtering.",
 mental:"A small window multiplied by the image and summed",
 mentalText:"Each output pixel is a weighted combination of its neighbourhood. Different kernels give different effects.",
 steps:["Define the kernel.","Pad the image.","Slide the kernel and compute dot products.","Write the output.","Handle borders."],
 pseudo:"2D convolution:\n  out[y, x] = sum_{i, j} kernel[i, j] * in[y - i, x - j]\n\n2D correlation (what most libraries call 'conv'):\n  out[y, x] = sum_{i, j} kernel[i, j] * in[y + i, x + j]\n\nBox blur (3x3, normalised):\n  1/9 1/9 1/9\n  1/9 1/9 1/9\n  1/9 1/9 1/9\n\nGaussian (3x3, sigma ~ 1):\n  1 2 1\n  2 4 2   / 16\n  1 2 1\n\nSeparable filter:\n  if kernel = outer(u, v), apply u then v\n  cost drops from O(k^2) to O(2k) per pixel\n\nBorder handling:\n  zero padding\n  replicate (clamp)\n  mirror\n  wrap\n\nCost:\n  direct: O(H W k^2)\n  separable: O(H W k)\n  FFT: O(H W log(H W)) for large kernels",
 uses:"Blurring, sharpening, edge detection, feature extraction, CNN layers.",
 strength:"Simple, local, parallelisable. Foundation of CNNs.",
 limits:"Direct convolution is expensive for large kernels. Borders need careful handling.",
 pitfall:"Forgetting to normalise the kernel. A box kernel that does not sum to 1 changes brightness.",
 question:"Why is a separable filter faster than a general 2D filter?",
 answer:"A k×k separable kernel factors into two 1D kernels. Cost drops from O(k²) to O(2k) per pixel.",
 demo:"convolution",sample:"box 3\n128",refs:[
  ["Gonzalez and Woods, Digital Image Processing, Chapter 3","https://www.pearson.com/en-us/subject-catalog/p/digital-image-processing/P200000003308"],
  ["Szeliski, Computer Vision: Algorithms and Applications, 2nd ed., Springer 2022","https://szeliski.org/Book/"],
  ["OpenCV, image filtering","https://docs.opencv.org/4.x/d4/d13/tutorial_py_filtering.html"]]},
{id:"gaussian-bilateral",title:"Gaussian and bilateral filters",level:3,kind:"Filtering",status:"Runnable teaching lab",
 summary:"A Gaussian filter smooths with weights that fall off with distance. A bilateral filter adds a range term, smoothing within regions but preserving edges.",
 mental:"A Gaussian blur that respects edges",
 mentalText:"The bilateral filter weights neighbours by both spatial distance and intensity difference. Similar-intensity neighbours get more weight.",
 steps:["Choose sigma_s (spatial) and sigma_r (range).","For each pixel, weight neighbours by both Gaussian terms.","Normalise.","Write the output."],
 pseudo:"Gaussian:\n  G(x, y) = exp(-(x^2 + y^2) / (2 sigma^2)) / (2 pi sigma^2)\n  out[p] = sum_q G(||p - q||) in[q] / sum_q G(||p - q||)\n\nBilateral:\n  w(p, q) = G_s(||p - q||) * G_r(|in[p] - in[q]|)\n  out[p] = sum_q w(p, q) in[q] / sum_q w(p, q)\n\nProperties:\n  Gaussian is linear, low-pass\n  Bilateral is non-linear, edge-preserving\n\nJoint bilateral:\n  range term uses a guide image (e.g., flash, depth)\n\nGuided filter:\n  linear-time edge-preserving filter\n  O(1) per pixel with box filters\n\nApplications:\n  Gaussian: pre-blur before derivatives\n  Bilateral: denoising, HDR tone mapping, stylisation",
 uses:"Denoising, detail enhancement, HDR, depth upsampling.",
 strength:"Bilateral preserves edges. Gaussian is fast and separable.",
 limits:"Bilateral is O(k²) per pixel. High sigma_r gives halos near strong edges.",
 pitfall:"Choosing a huge sigma_r. The range term becomes almost flat and the filter behaves like a Gaussian blur.",
 question:"What does the range term in a bilateral filter do?",
 answer:"It down-weights neighbours whose intensity differs from the centre pixel. This preserves edges while smoothing flat regions.",
 demo:"bilateral",sample:"128\n2.0\n30",refs:[
  ["Tomasi and Manduchi, Bilateral filtering for gray and color images, ICCV 1998","https://doi.org/10.1109/ICCV.1998.710815"],
  ["He, Sun, Tang, Guided image filtering, ECCV 2010","https://doi.org/10.1007/978-3-642-15549-9_1"],
  ["Paris et al., A gentle introduction to bilateral filtering and its applications, SIGGRAPH 2007","https://people.csail.mit.edu/sparis/bf_course/"]]},
{id:"unsharp-masking",title:"Unsharp masking and sharpening",level:3,kind:"Filtering",status:"Runnable teaching lab",
 summary:"Unsharp masking subtracts a blurred copy from the original to create a high-pass detail layer, then adds it back scaled. It sharpens edges without amplifying noise too much.",
 mental:"Original plus a scaled copy of its own detail",
 mentalText:"Detail = original - blurred. Sharpen by adding detail back with a gain factor. Too much gain creates halos.",
 steps:["Blur the image with a Gaussian.","Compute the detail layer.","Add gain times detail to the original.","Clamp to the valid range."],
 pseudo:"Unsharp mask:\n  blur   = Gaussian(in, sigma)\n  detail = in - blur\n  sharp  = in + amount * detail\n\nEquivalent high-pass:\n  sharp = (1 + amount) in - amount * blur\n\nUnsharp kernel (3x3, amount = 1):\n   0 -1  0\n  -1  5 -1\n   0 -1  0\n\nThreshold:\n  only sharpen where |detail| > threshold\n  reduces noise amplification\n\nHalo control:\n  use a larger sigma for gentle sharpening\n  small sigma sharpens fine detail but risks noise\n\nLocal contrast enhancement:\n  apply unsharp masking at multiple scales\n  add the results",
 uses:"Photo sharpening, medical imaging, microscopy, detail enhancement.",
 strength:"Simple, effective, tunable.",
 limits:"Amplifies noise. Halos near strong edges.",
 pitfall:"Using a small radius with a large amount. Creates visible halos and noise.",
 question:"Why does unsharp masking amplify noise?",
 answer:"The detail layer includes high-frequency noise. Adding it back with a gain factor amplifies both edges and noise.",
 demo:"unsharp",sample:"128\n1.2\n2.0",refs:[
  ["Gonzalez and Woods, Digital Image Processing, Chapter 3","https://www.pearson.com/en-us/subject-catalog/p/digital-image-processing/P200000003308"],
  ["Russ, The Image Processing Handbook, 7th ed., CRC 2016","https://www.routledge.com/The-Image-Processing-Handbook/Russ-Neal/p/book/9781498740265"],
  ["Adobe, Understanding sharpening","https://helpx.adobe.com/photoshop/using/sharpening-adjustment.html"]]},
/* Ch 3 */
{id:"sobel-prewitt",title:"Gradient operators: Sobel, Prewitt, Roberts, Laplacian",level:3,kind:"Edges",status:"Runnable teaching lab",
 summary:"Gradient operators estimate the first derivative of the image. Sobel and Prewitt use smoothing plus differencing. Roberts uses a 2x2 diagonal kernel. Laplacian estimates the second derivative.",
 mental:"Small kernels that respond to intensity change",
 mentalText:"Edge strength is the gradient magnitude. Edge direction is the gradient angle. The Laplacian responds to both edges and fine detail.",
 steps:["Compute the horizontal and vertical derivatives.","Take the magnitude.","Optionally compute the direction.","Threshold."],
 pseudo:"Sobel X:\n  -1 0 1\n  -2 0 2\n  -1 0 1\n\nSobel Y:\n  -1 -2 -1\n   0  0  0\n   1  2  1\n\nPrewitt X:\n  -1 0 1\n  -1 0 1\n  -1 0 1\n\nRoberts (2x2):\n  +1  0      0 +1\n   0 -1     -1  0\n\nLaplacian (4-neighbour):\n  0  1  0\n  1 -4  1\n  0  1  0\n\nLaplacian (8-neighbour):\n  1  1  1\n  1 -8  1\n  1  1  1\n\nGradient magnitude and direction:\n  mag = sqrt(Gx^2 + Gy^2)\n  ang = atan2(Gy, Gx)\n\nLaplacian of Gaussian (LoG):\n  blur with Gaussian, then apply Laplacian\n  zero-crossings mark edges",
 uses:"Edge detection, feature extraction, texture analysis, medical imaging.",
 strength:"Fast, local, easy to implement.",
 limits:"Noisy on real images. Sobel smooths but still amplifies noise. Laplacian is very noise-sensitive.",
 pitfall:"Applying the Laplacian without smoothing. It amplifies high-frequency noise badly. Use LoG instead.",
 question:"Why do Sobel and Prewitt kernels include smoothing?",
 answer:"They approximate the derivative of a smoothed signal. The horizontal smoothing reduces noise sensitivity compared to a pure difference.",
 demo:"sobel",sample:"128\n80",refs:[
  ["Sobel and Feldman, A 3x3 isotropic gradient operator for image processing, 1968","https://www.researchgate.net/publication/239398674"],
  ["Marr and Hildreth, Theory of edge detection, Proc. R. Soc. B 1980","https://doi.org/10.1098/rspb.1980.0020"],
  ["OpenCV, edge detection","https://docs.opencv.org/4.x/da/d22/tutorial_py_canny.html"]]},
{id:"canny",title:"Canny edge detector",level:4,kind:"Edges",status:"Runnable teaching lab",
 summary:"Canny combines Gaussian smoothing, gradient computation, non-maximum suppression and hysteresis thresholding. It produces thin, well-localised edges.",
 mental:"Smooth, find gradients, thin them, then link the strong ones",
 mentalText:"Non-maximum suppression keeps only local maxima along the gradient direction. Hysteresis links weak edges to strong ones.",
 steps:["Smooth with a Gaussian.","Compute gradient magnitude and direction.","Non-maximum suppression along the gradient.","Double threshold: strong and weak.","Hysteresis: keep weak edges connected to strong ones."],
 pseudo:"1. Gaussian blur (sigma ~ 1.4)\n2. Gradient: Sobel Gx, Gy\n   mag = sqrt(Gx^2 + Gy^2)\n   ang = atan2(Gy, Gx) quantised to 0, 45, 90, 135\n3. Non-maximum suppression:\n   for each pixel, compare to two neighbours along the gradient direction\n   keep only if it is a local maximum\n4. Double threshold:\n   strong if mag > T_high\n   weak   if T_low < mag <= T_high\n5. Hysteresis:\n   keep weak edges connected (8-connected) to strong edges\n   discard the rest\n\nParameters:\n  sigma      smoothing\n  T_low      weak threshold\n  T_high     strong threshold, often 2-3x T_low\n\nProperties:\n  good detection: low error rate\n  good localisation: edges near the true edge\n  single response: one response per edge\n\nExtensions:\n  auto thresholds from the gradient histogram\n  Canny-Deriche recursive Gaussian",
 uses:"Preprocessing for Hough, contours, feature detectors, SLAM.",
 strength:"Optimal in a precise sense. Thin, well-localised edges. Two thresholds handle noise.",
 limits:"Parameters need tuning. Poor on texture-rich regions. Not learned.",
 pitfall:"Setting T_high too low. Produces too many edges and defeats the purpose of hysteresis.",
 question:"What does non-maximum suppression do?",
 answer:"It thins the edge to one pixel by keeping only local maxima along the gradient direction. Without it, edges are thick.",
 demo:"canny",sample:"1.4\n30\n90",refs:[
  ["Canny, A computational approach to edge detection, IEEE TPAMI 1986","https://doi.org/10.1109/TPAMI.1986.4767851"],
  ["OpenCV, Canny edge detector","https://docs.opencv.org/4.x/da/d22/tutorial_py_canny.html"],
  ["Szeliski, Computer Vision, Chapter 4","https://szeliski.org/Book/"]]},
{id:"harris-shi-tomasi",title:"Harris and Shi-Tomasi corner detectors",level:4,kind:"Corners",status:"Runnable teaching lab",
 summary:"The Harris detector measures how much the image changes when shifted in different directions. Corners change in all directions. Shi-Tomasi uses the smaller eigenvalue directly.",
 mental:"Slide a small window and see how much the content changes",
 mentalText:"The structure tensor summarises the local gradient distribution. Its eigenvalues tell you edge (one large), corner (both large) or flat (both small).",
 steps:["Compute image gradients Ix, Iy.","Form the structure tensor M = [[Σ Ix², Σ Ix Iy], [Σ Ix Iy, Σ Iy²]].","Compute eigenvalues or the Harris response.","Threshold and apply non-maximum suppression.","Refine to subpixel if needed."],
 pseudo:"Structure tensor:\n  M = sum over window of\n      [ Ix^2   Ix Iy ]\n      [ Ix Iy  Iy^2  ]\n\nEigenvalues lambda1, lambda2:\n  both small    : flat region\n  one large     : edge\n  both large    : corner\n\nHarris response:\n  R = det(M) - k * trace(M)^2\n  det = lambda1 * lambda2\n  trace = lambda1 + lambda2\n  k ~ 0.04 to 0.06\n\nShi-Tomasi:\n  R = min(lambda1, lambda2)\n  better for tracking (KLT)\n\nSubpixel refinement:\n  fit a quadratic to the response\n\nRotation invariance:\n  M is rotation invariant because it depends on the\n  gradient covariance\n\nNot scale invariant:\n  use Harris-Laplace or scale-space for scale invariance",
 uses:"Tracking, SLAM, image alignment, panorama stitching, structure from motion.",
 strength:"Rotation invariant. Simple and fast. Good for tracking.",
 limits:"Not scale invariant. Sensitive to noise.",
 pitfall:"Using a single global threshold. Corners have varying strength across the image. Adaptive thresholds help.",
 question:"What do the eigenvalues of the structure tensor tell you?",
 answer:"Both small = flat. One large = edge. Both large = corner. The Harris response combines them into a single score.",
 demo:"harris",sample:"128\n0.04\n0.01",refs:[
  ["Harris and Stephens, A combined corner and edge detector, Alvey Vision Conference 1988","https://doi.org/10.5244/C.2.23"],
  ["Shi and Tomasi, Good features to track, CVPR 1994","https://doi.org/10.1109/CVPR.1994.323794"],
  ["OpenCV, Shi-Tomasi corner detector","https://docs.opencv.org/4.x/d4/d8c/tutorial_py_shi_tomasi.html"]]},
/* Ch 4 */
{id:"otsu",title:"Global thresholding and Otsu's method",level:2,kind:"Segmentation",status:"Runnable teaching lab",
 summary:"Global thresholding separates foreground from background using a single intensity value. Otsu's method picks the threshold that maximises between-class variance.",
 mental:"Find the valley between two histogram peaks",
 mentalText:"Otsu tries every threshold and picks the one where the two groups are most separated.",
 steps:["Compute the histogram.","For each candidate threshold, split into two classes.","Compute the between-class variance.","Pick the threshold with the maximum.","Apply."],
 pseudo:"Otsu's method:\n  for t in 0..255:\n    w0 = sum h[0..t] / N\n    w1 = 1 - w0\n    mu0 = weighted mean of class 0\n    mu1 = weighted mean of class 1\n    sigma_b^2 = w0 * w1 * (mu0 - mu1)^2\n  pick t that maximises sigma_b^2\n\nProperties:\n  assumes bimodal histogram\n  O(N + L) with L levels\n  fast and parameter-free\n\nMulti-level Otsu:\n  extend to k classes\n  exponential in k\n\nLocal / adaptive threshold:\n  threshold per pixel from its neighbourhood\n  mean or Gaussian weighted\n  good for uneven illumination\n\nNiblack, Sauvola:\n  adaptive methods tuned for document images",
 uses:"Document binarisation, segmentation of high-contrast objects, cell counting.",
 strength:"Parameter-free, fast, works well on bimodal histograms.",
 limits:"Fails on unimodal or strongly multi-modal histograms. Sensitive to illumination gradients.",
 pitfall:"Applying Otsu to an image with uneven lighting. Use adaptive thresholding instead.",
 question:"When does Otsu's method fail?",
 answer:"When the histogram is not bimodal, e.g., a single peak or three or more peaks. It also fails under strong illumination gradients.",
 demo:"otsu",sample:"128",refs:[
  ["Otsu, A threshold selection method from gray-level histograms, IEEE SMC 1979","https://doi.org/10.1109/TSMC.1979.4310076"],
  ["Sauvola and Pietikäinen, Adaptive document image binarization, Pattern Recognition 2000","https://doi.org/10.1016/S0031-3203(99)00055-2"],
  ["scikit-image, thresholding","https://scikit-image.org/docs/stable/auto_examples/segmentation/plot_thresholding.html"]]},
{id:"adaptive-threshold",title:"Adaptive thresholding",level:3,kind:"Segmentation",status:"Runnable teaching lab",
 summary:"Adaptive thresholding computes a local threshold per pixel from its neighbourhood. It handles uneven illumination where a global threshold fails.",
 mental:"A different threshold at each pixel, from the local mean",
 mentalText:"For each pixel, compute the mean or Gaussian-weighted mean of a window. Threshold against (mean - C).",
 steps:["Choose the window size.","For each pixel, compute the local mean or Gaussian mean.","Threshold: pixel > local_mean - C.","Combine with global constraints if needed."],
 pseudo:"Mean adaptive:\n  T(x, y) = mean(window(x, y)) - C\n  out(x, y) = 255 if in(x, y) > T else 0\n\nGaussian adaptive:\n  T(x, y) = Gaussian_blur(in)(x, y) - C\n\nParameters:\n  block size   window in pixels, odd\n  C            constant subtracted from the mean\n\nNiblack:\n  T = mu + k * sigma, k ~ -0.2\n\nSauvola:\n  T = mu * (1 + k * (sigma / R - 1)), R = 128, k ~ 0.5\n\nIntegral image:\n  compute local sums in O(1) per pixel\n  makes adaptive thresholding O(H W)\n\nApplications:\n  document binarisation under uneven light\n  microscopic imaging\n  text detection",
 uses:"Document analysis, OCR preprocessing, industrial inspection.",
 strength:"Handles illumination gradients. Simple to implement.",
 limits:"Window size is critical. Too small adds noise; too large loses adaptivity.",
 pitfall:"Choosing a window that is smaller than the objects you want to detect. Objects become hollow.",
 question:"Why does a small adaptive window make objects hollow?",
 answer:"The window sees only the object's interior, so the local mean is close to the object intensity. Only the boundaries differ enough to threshold.",
 demo:"adaptive",sample:"128\n15\n10",refs:[
  ["Niblack, An Introduction to Digital Image Processing, Prentice Hall 1986","https://www.pearson.com/en-us/subject-catalog/p/an-introduction-to-digital-image-processing/P200000003331"],
  ["Sauvola and Pietikäinen, Adaptive document image binarization, 2000","https://doi.org/10.1016/S0031-3203(99)00055-2"],
  ["OpenCV, adaptive thresholding","https://docs.opencv.org/4.x/d7/d4d/tutorial_py_thresholding.html"]]},
{id:"connected-components",title:"Connected components",level:3,kind:"Segmentation",status:"Runnable teaching lab",
 summary:"Connected components labels groups of adjacent foreground pixels. Two-pass union-find is the classic algorithm. 4-connectivity or 8-connectivity defines adjacency.",
 mental:"Group touching pixels into objects",
 mentalText:"Scan the image. Assign provisional labels. Union labels that touch. Renumber to a compact set.",
 steps:["First pass: assign provisional labels, record equivalences.","Resolve equivalences with union-find.","Second pass: relabel with canonical IDs.","Compute per-component statistics."],
 pseudo:"Two-pass algorithm:\n  pass 1:\n    for each foreground pixel:\n      look at already-processed neighbours (N, W for 4-conn)\n      if no labelled neighbour: new label\n      else: smallest neighbour label, union with others\n  resolve equivalences (union-find)\n  pass 2:\n    relabel with canonical IDs\n\nConnectivity:\n  4-connectivity: N, S, E, W\n  8-connectivity: add diagonals\n  dual: 4-conn foreground needs 8-conn background\n\nTwo-pass is O(N alpha(N)) with union-find\n\nAlternative: one-pass with a decision tree (Wu, Suzuki)\n\nApplications:\n  counting objects\n  filtering by area\n  per-object statistics\n  blob analysis",
 uses:"Object counting, blob analysis, OCR preprocessing, biology.",
 strength:"Simple, fast, well-defined. Handles thousands of components.",
 limits:"Requires a binary input. Sensitivity to connectivity choice.",
 pitfall:"Mixing 4-connectivity for foreground and background. They must be dual.",
 question:"Why is union-find used in connected components?",
 answer:"When a pixel has two different labelled neighbours, those labels belong to the same component. Union-find merges them efficiently.",
 demo:"components",sample:"1",refs:[
  ["Rosenfeld and Pfaltz, Sequential operations in digital picture processing, JACM 1966","https://doi.org/10.1145/321356.321357"],
  ["Wu, Sahoo, Xu, Recent advances in connected component labeling, 2009","https://doi.org/10.1109/ICIP.2009.5414264"],
  ["scikit-image, label","https://scikit-image.org/docs/stable/api/skimage.measure.html#skimage.measure.label"]]},
{id:"watershed-grabcut",title:"Watershed and GrabCut",level:4,kind:"Segmentation",status:"Concept lesson",
 summary:"Watershed treats the image as a topographic surface and floods it from markers. GrabCut models foreground and background colour distributions with GMMs and optimises a graph cut.",
 mental:"Flooding a landscape from seed points",
 mentalText:"Watershed segments touching objects if you provide markers. GrabCut requires a rough rectangle and iterates between GMM fitting and graph cut.",
 steps:["Watershed: compute the gradient, place markers, flood.","GrabCut: initialise GMMs from the rectangle.","Iterate: assign pixels to GMMs, update GMMs, graph cut.","Repeat until convergence."],
 pseudo:"Watershed:\n  compute gradient magnitude as the topographic surface\n  markers: seeds for each region\n  priority queue from markers\n  repeatedly pop the lowest pixel and assign it to a region\n  boundaries appear where regions meet\n\nMarker-based:\n  distance transform + local maxima for seeds\n  or manual markers\n\nGrabCut:\n  initial trimap: background, foreground, unknown\n  fit Gaussian mixture models to FG and BG\n  build a graph: source = FG, sink = BG\n  edge weights from colour similarity\n  min-cut to reassign unknown pixels\n  refit GMMs, repeat\n\nApplications:\n  cell segmentation\n  interactive foreground extraction\n  panorama seams",
 uses:"Medical imaging, cell biology, interactive selection, panorama stitching.",
 strength:"Watershed separates touching objects. GrabCut gives pixel-accurate masks with minimal input.",
 limits:"Watershed over-segments without markers. GrabCut needs a good initial rectangle.",
 pitfall:"Running watershed on a noisy gradient. The result over-segments into thousands of pieces. Smooth first.",
 question:"Why does watershed need markers?",
 answer:"Without markers, watershed floods from every local minimum and over-segments. Markers identify the regions you actually want.",
 demo:"none",sample:"",refs:[
  ["Beucher and Lantuéjoul, Use of watersheds in contour detection, 1979","https://www.researchgate.net/publication/233950963"],
  ["Rother, Kolmogorov, Blake, GrabCut: interactive foreground extraction using iterated graph cuts, SIGGRAPH 2004","https://doi.org/10.1145/1015706.1015720"],
  ["scikit-image, watershed","https://scikit-image.org/docs/stable/auto_examples/segmentation/plot_watershed.html"]]},
/* Ch 5 */
{id:"morphology",title:"Morphology: erosion, dilation, opening, closing",level:3,kind:"Morphology",status:"Runnable teaching lab",
 summary:"Morphology operates on binary or grayscale images with a structuring element. Erosion shrinks foreground. Dilation grows it. Opening removes small objects. Closing fills small holes.",
 mental:"A stamp that grows, shrinks, or cleans up shapes",
 mentalText:"The structuring element slides over the image. Erosion keeps the minimum. Dilation keeps the maximum. Open = erode then dilate. Close = dilate then erode.",
 steps:["Choose the structuring element.","Erode, dilate, or compose.","Apply to a binary or grayscale image.","Use opening for noise removal, closing for gap filling."],
 pseudo:"Erosion (binary):\n  out[p] = 1 if all pixels in SE(p) are 1\n\nDilation (binary):\n  out[p] = 1 if any pixel in SE(p) is 1\n\nGrayscale erosion:\n  out[p] = min over SE(p) of in[q]\n\nGrayscale dilation:\n  out[p] = max over SE(p) of in[q]\n\nOpening:\n  open(I, SE) = dilate(erode(I, SE), SE)\n  removes small bright objects\n\nClosing:\n  close(I, SE) = erode(dilate(I, SE), SE)\n  fills small dark holes\n\nTop-hat:\n  white_tophat = I - open(I)\n  black_tophat = close(I) - I\n\nHit-or-miss:\n  detect specific patterns\n\nSkeletonisation:\n  iteratively thin until a 1-pixel skeleton remains",
 uses:"Noise removal, shape analysis, document processing, microscopy.",
 strength:"Simple, non-linear, preserves shape information.",
 limits:"Structuring element choice matters. Not rotation invariant unless SE is.",
 pitfall:"Using a large structuring element on fine detail. It removes features you wanted to keep.",
 question:"What does opening remove that closing does not?",
 answer:"Opening removes small bright objects. Closing fills small dark holes. They are dual operations.",
 demo:"morphology",sample:"3\n1",refs:[
  ["Serra, Image Analysis and Mathematical Morphology, Academic Press 1982","https://www.elsevier.com/books/image-analysis-and-mathematical-morphology/serra/978-0-12-637240-3"],
  ["Soille, Morphological Image Analysis, 2nd ed., Springer 2004","https://link.springer.com/book/10.1007/978-3-662-05088-0"],
  ["OpenCV, morphological operations","https://docs.opencv.org/4.x/d9/d61/tutorial_py_morphological_ops.html"]]},
{id:"nlm-bm3d",title:"Non-local means and BM3D",level:5,kind:"Denoising",status:"Concept lesson",
 summary:"Non-local means (NLM) averages similar patches across the whole image, not just neighbours. BM3D groups similar patches into 3D blocks, applies a transform, and thresholds in the transform domain.",
 mental:"Find similar patches everywhere, then average them",
 mentalText:"NLM weights each pixel by the similarity of its patch to the target patch. BM3D extends this with a 3D transform and collaborative filtering.",
 steps:["NLM: for each pixel, find similar patches.","Weight by patch similarity.","Average.","BM3D: group similar patches into 3D blocks.","Apply 3D transform, threshold, invert.","Aggregate estimates."],
 pseudo:"Non-local means:\n  w(p, q) = exp(-||patch(p) - patch(q)||^2 / h^2)\n  out[p] = sum_q w(p, q) in[q] / sum_q w(p, q)\n  h = filter strength\n\nBM3D:\n  step 1 (hard thresholding):\n    group similar patches into a 3D block\n    apply 3D transform (DCT + Haar)\n    threshold small coefficients\n    inverse transform\n  step 2 (Wiener):\n    use step 1 as a guide\n    Wiener filter in the transform domain\n\nPatch similarity:\n  L2 distance after mean subtraction and normalisation\n  search window limits cost\n\nComplexity:\n  NLM O(H W S^2 P^2), S = search window\n  BM3D similar with grouping overhead\n\nState of the art:\n  still competitive with CNNs on some benchmarks\n  BM3D is the classical benchmark",
 uses:"Denoising of photos, medical images, video.",
 strength:"Preserves detail better than Gaussian blur. Non-local information.",
 limits:"Slow. Parameters need tuning. Textures with repeating patterns can be over-smoothed.",
 pitfall:"Using a huge search window. Marginal quality gain for a big cost increase.",
 question:"What is the key idea of non-local means?",
 answer:"Similar patches occur throughout the image, not just nearby. Weighting by patch similarity exploits this redundancy for better denoising.",
 demo:"none",sample:"",refs:[
  ["Buades, Coll, Morel, A non-local algorithm for image denoising, CVPR 2005","https://doi.org/10.1109/CVPR.2005.38"],
  ["Dabov et al., Image denoising by sparse 3D transform-domain collaborative filtering, IEEE TIP 2007","https://doi.org/10.1109/TIP.2007.901238"],
  ["Milanfar, A tour of modern image filtering, IEEE Signal Processing Magazine 2013","https://doi.org/10.1109/MSP.2012.2230481"]]},
{id:"tv-clahe",title:"Total variation and CLAHE",level:4,kind:"Enhancement",status:"Runnable teaching lab",
 summary:"Total variation (TV) denoising minimises the L1 norm of the gradient, producing piecewise-constant results. CLAHE is contrast-limited adaptive histogram equalisation, a local contrast enhancer.",
 mental:"Smooth except at edges, or boost local contrast without noise",
 mentalText:"TV penalises variation, so flat regions become flat and edges are preserved. CLAHE equalises the histogram in tiles with a clip limit.",
 steps:["TV: minimise ||u - f||² + λ ||∇u||.","Use a primal-dual or split Bregman method.","CLAHE: divide into tiles.","Equalise each tile's histogram with a clip limit.","Interpolate between tiles."],
 pseudo:"Total variation:\n  min_u 0.5 ||u - f||^2 + lambda * TV(u)\n  TV(u) = sum |grad u|\n\nPrimal-dual (Chambolle-Pock):\n  iterate p, u\n  p = prox of the dual norm\n  u = (f + div(p)) / (1 + tau)\n\nTV-L1:\n  replace L2 data term with L1\n  better for salt-and-pepper noise\n\nCLAHE:\n  divide the image into tiles (8x8 typical)\n  compute each tile's histogram\n  clip histogram at a limit, redistribute the excess\n  equalise the clipped histogram\n  bilinearly interpolate between tile mappings\n\nParameters:\n  tile size\n  clip limit (higher = more contrast)\n\nApplications:\n  medical imaging (X-ray, CT)\n  microscopy\n  low-light photos",
 uses:"Denoising, restoration, medical and scientific imaging, low-light enhancement.",
 strength:"TV preserves sharp edges. CLAHE boosts local contrast without amplifying global noise.",
 limits:"TV produces staircasing. CLAHE can amplify noise in flat regions.",
 pitfall:"Over-regularising with TV. Flat regions become overly flat and lose texture.",
 question:"Why does TV produce piecewise-constant results?",
 answer:"The L1 gradient penalty prefers regions with zero gradient. The result is flat except at edges.",
 demo:"tv-clahe",sample:"128\n0.1\n8\n2.0",refs:[
  ["Rudin, Osher, Fatemi, Nonlinear total variation based noise removal algorithms, Physica D 1992","https://doi.org/10.1016/0167-2789(92)90242-F"],
  ["Zuiderveld, Contrast limited adaptive histogram equalization, in Graphics Gems IV, 1994","https://www.sciencedirect.com/science/article/pii/B9780123361561500254"],
  ["Chambolle and Pock, A first-order primal-dual algorithm for convex problems, JMIV 2011","https://doi.org/10.1007/s10851-010-0251-1"]]},
/* Ch 6 */
{id:"sift-surf",title:"SIFT and SURF",level:5,kind:"Features",status:"Concept lesson",
 summary:"SIFT detects scale-space extrema of the difference of Gaussians, assigns orientations, and describes each keypoint with a 128-dim histogram of gradients. SURF approximates this with box filters and Haar wavelets.",
 mental:"Find keypoints that survive changes of scale and rotation",
 mentalText:"SIFT builds a Gaussian pyramid, finds extrema in the difference of Gaussians, and computes a rotation-invariant descriptor.",
 steps:["Build a Gaussian pyramid.","Compute the difference of Gaussians.","Find extrema in 3D (x, y, scale).","Assign orientation from the gradient histogram.","Compute the 128-dim descriptor."],
 pseudo:"Scale space:\n  L(x, y, sigma) = G(x, y, sigma) * I(x, y)\n  DoG = L(x, y, k sigma) - L(x, y, sigma)\n\nKeypoint detection:\n  find local extrema of DoG in 3D (x, y, sigma)\n  reject low-contrast and edge-like points\n\nOrientation assignment:\n  gradient histogram over a 36-bin circle\n  peak gives the keypoint orientation\n\nDescriptor:\n  16x16 window around keypoint\n  divided into 4x4 subregions\n  8-bin gradient orientation histogram per subregion\n  4 * 4 * 8 = 128 dimensions\n  normalise, clip at 0.2, renormalise\n\nSURF:\n  use box filters instead of Gaussian derivatives\n  integral image for O(1) box sums\n  Haar wavelets for orientation\n  descriptor 64 or 128 dims\n\nMatching:\n  nearest neighbour with a ratio test\n  Lowe's ratio: d1 / d2 < 0.8",
 uses:"Panorama stitching, SLAM, object recognition, image retrieval.",
 strength:"Scale and rotation invariant. Robust to moderate illumination change. Well-tested.",
 limits:"Slow by modern standards. Patented until recently. Not robust to large viewpoint change.",
 pitfall:"Matching without a ratio test. Ambiguous matches create false correspondences. Use Lowe's ratio.",
 question:"What makes SIFT scale invariant?",
 answer:"Keypoints are detected as extrema across a Gaussian pyramid. The same physical feature is found at whatever scale it appears.",
 demo:"none",sample:"",refs:[
  ["Lowe, Distinctive image features from scale-invariant keypoints, IJCV 2004","https://doi.org/10.1023/B:VISI.0000029664.99615.94"],
  ["Bay et al., SURF: speeded up robust features, ECCV 2006","https://doi.org/10.1007/11744023_32"],
  ["OpenCV, SIFT","https://docs.opencv.org/4.x/da/df5/tutorial_py_sift_intro.html"]]},
{id:"orb-fast-brief",title:"ORB, FAST and BRIEF",level:4,kind:"Features",status:"Runnable teaching lab",
 summary:"FAST detects corners by comparing a pixel to a circle of neighbours. BRIEF describes patches with binary intensity comparisons. ORB combines FAST with an oriented BRIEF descriptor.",
 mental:"Fast corner detection plus a binary descriptor",
 mentalText:"FAST is very fast because it only does comparisons. BRIEF uses 256 binary tests. ORB adds orientation and scale for robustness.",
 steps:["FAST: for each pixel, check a circle of 16 neighbours.","If 9+ are all brighter or darker, it is a corner.","Non-maximum suppression to remove duplicates.","ORB: compute orientation from the intensity centroid.","Rotate the BRIEF pattern and compute binary descriptor."],
 pseudo:"FAST-9:\n  circle of 16 pixels around p with radius 3\n  if at least 9 contiguous are all > p + t or < p - t:\n    p is a corner\n\nNon-maximum suppression:\n  compute FAST score = sum of absolute differences\n  keep only local maxima in a 3x3 window\n\nIntensity centroid orientation:\n  m01 = sum y * I(y, x)\n  m10 = sum x * I(y, x)\n  theta = atan2(m01, m10)\n\nBRIEF:\n  256 pre-defined pairs of pixels in a patch\n  bit i = 1 if I(p_i) < I(q_i)\n  descriptor = 256 bits = 32 bytes\n\nORB = oFAST + rBRIEF:\n  rotate the BRIEF pattern by theta\n  scale pyramid for multi-scale\n\nMatching:\n  Hamming distance on the binary descriptors\n  very fast (popcount on XOR)\n\nFAST-ER, AGAST:\n  improvements on the FAST corner test",
 uses:"Real-time SLAM (ORB-SLAM), AR, mobile vision, robotics.",
 strength:"Extremely fast. Binary descriptor is compact and fast to match.",
 limits:"Less robust than SIFT to large scale or viewpoint change. Binary descriptor loses information.",
 pitfall:"Using FAST without non-maximum suppression. The result is a dense cluster of corners per actual feature.",
 question:"Why is ORB faster than SIFT?",
 answer:"FAST corner detection uses only comparisons. The BRIEF descriptor is binary and matched with Hamming distance. SIFT uses floating-point gradients and descriptors.",
 demo:"orb",sample:"128\n20\n0.05",refs:[
  ["Rosten and Drummond, Machine learning for high-speed corner detection, ECCV 2006","https://doi.org/10.1007/11744023_34"],
  ["Calonder et al., BRIEF: binary robust independent elementary features, ECCV 2010","https://doi.org/10.1007/978-3-642-15561-1_56"],
  ["Rublee et al., ORB: an efficient alternative to SIFT or SURF, ICCV 2011","https://doi.org/10.1109/ICCV.2011.6126544"]]},
{id:"hough-template",title:"Hough transform and template matching",level:4,kind:"Matching",status:"Runnable teaching lab",
 summary:"The Hough transform votes for parameterised shapes (lines, circles). Peaks in the accumulator are the detected shapes. Template matching slides a patch and computes a similarity score.",
 mental:"Vote for the shapes that pass through the edges",
 mentalText:"Each edge pixel votes for all shapes it could belong to. Shapes with many votes are detected. Template matching is a direct search.",
 steps:["Detect edges.","For each edge pixel, vote for parameter combinations.","Find peaks in the accumulator.","Template matching: slide the template.","Compute NCC or SSD at each position."],
 pseudo:"Hough for lines (rho, theta):\n  for each edge pixel (x, y):\n    for theta in 0..180:\n      rho = x cos(theta) + y sin(theta)\n      H[rho, theta] += 1\n  find peaks in H\n\nHough for circles (a, b, r):\n  for each edge pixel (x, y):\n    for a in x - r..x + r:\n      b = y +/- sqrt(r^2 - (a - x)^2)\n      H[a, b, r] += 1\n\nProbabilistic Hough:\n  use random subsets of edge pixels\n  faster, less accurate\n\nTemplate matching:\n  slide template T over image I\n  NCC(x, y) = sum (T - meanT)(I - meanI) /\n               (sigma_T sigma_I)\n  SSD(x, y) = sum (T - I)^2\n  pick the best score above a threshold\n\nZero-mean NCC is invariant to brightness and contrast changes\n\nFast matching:\n  FFT-based for large templates\n  pyramid search for multi-scale\n  integral images for box sums",
 uses:"Lane detection, document analysis, industrial inspection, registration.",
 strength:"Robust to partial occlusion and noise (Hough). Simple to implement.",
 limits:"Hough is slow and needs careful quantisation. Template matching is not rotation or scale invariant.",
 pitfall:"Quantising Hough accumulator too coarsely. Nearby lines merge into one peak.",
 question:"Why is template matching not rotation invariant?",
 answer:"The template is compared pixel-to-pixel at each position. Rotating the template changes the pixel pattern and the score drops.",
 demo:"hough",sample:"128\n80\n60",refs:[
  ["Hough, Method and means for recognizing complex patterns, US Patent 3,069,654, 1962","https://patents.google.com/patent/US3069654A/en"],
  ["Duda and Hart, Use of the Hough transformation to detect lines and curves in pictures, CACM 1972","https://doi.org/10.1145/361237.361242"],
  ["OpenCV, Hough line transform","https://docs.opencv.org/4.x/d6/d10/tutorial_py_houghlines.html"]]},
/* Ch 7 */
{id:"affine-homography",title:"Affine transforms, homography and DLT",level:4,kind:"Geometry",status:"Runnable teaching lab",
 summary:"An affine transform preserves parallelism. A homography maps between two planes viewed by a pinhole camera. DLT estimates a homography from point correspondences.",
 mental:"A 3x3 matrix that warps one image onto another",
 mentalText:"The homography has 8 degrees of freedom. Four point correspondences determine it. DLT solves for it linearly.",
 steps:["Collect 4+ point correspondences.","Build the DLT matrix.","Solve with SVD.","Normalise.","Warp the image with the homography."],
 pseudo:"Affine transform (2x3):\n  [x']   [a b tx] [x]\n  [y'] = [c d ty] [y]\n                    [1]\n  preserves parallelism, 6 DOF\n\nHomography (3x3):\n  [x']       [h11 h12 h13] [x]\n  [y'] ~ H = [h21 h22 h23] [y]\n  [w ]       [h31 h32 h33] [1]\n  x' = x/w, y' = y/w, 8 DOF\n\nDLT:\n  for each correspondence (x, y) -> (x', y'):\n    build two rows in A (2N x 9)\n  solve A h = 0 via SVD\n  h = right singular vector for smallest singular value\n\nNormalisation (Hartley):\n  translate to centroid, scale so mean distance = sqrt(2)\n  improves numerical conditioning\n\nRANSAC for homography:\n  sample 4 correspondences\n  estimate H, count inliers\n  repeat, then refine with all inliers\n\nApplications:\n  document scan rectification\n  panorama\n  AR markers\n  stereo rectification",
 uses:"Panorama stitching, document scanning, augmented reality, stereo rectification.",
 strength:"Simple, well-understood, closed-form from 4 points.",
 limits:"Requires point correspondences. Sensitive to outliers without RANSAC.",
 pitfall:"Estimating H without normalising the points. Numerically unstable and inaccurate.",
 question:"How many point correspondences determine a homography?",
 answer:"Four. Each correspondence gives two equations. The homography has 8 degrees of freedom.",
 demo:"homography",sample:"100\n80\n0.0",refs:[
  ["Hartley and Zisserman, Multiple View Geometry in Computer Vision, 2nd ed., Cambridge 2004","https://www.cambridge.org/core/books/multiple-view-geometry-in-computer-vision/"],
  ["Szeliski, Computer Vision, Chapter 2","https://szeliski.org/Book/"],
  ["OpenCV, homography","https://docs.opencv.org/4.x/d9/dab/tutorial_homography.html"]]},
{id:"camera-calibration",title:"Camera calibration and the pinhole model",level:5,kind:"Geometry",status:"Concept lesson",
 summary:"Camera calibration recovers the intrinsic matrix K, distortion coefficients, and extrinsic pose. Zhang's method uses a planar calibration target viewed from multiple angles.",
 mental:"Model the camera as a projection from 3D world to 2D image",
 mentalText:"The pinhole model maps a 3D point through the extrinsic pose, the intrinsics, and a perspective divide.",
 steps:["Photograph a calibration target from many angles.","Detect target features in each image.","Estimate homographies.","Solve for intrinsics from the constraints.","Estimate extrinsics and distortion."],
 pseudo:"Pinhole projection:\n  [u]       [fx  0 cx] [r11 r12 r13 t1] [X]\n  [v] ~ K R [ 0 fy cy] [r21 r22 r23 t2] [Y]\n  [1]       [ 0  0  1] [r31 r32 r33 t3] [Z]\n                              [1]\n\nIntrinsics K:\n  fx, fy = focal lengths in pixels\n  cx, cy = principal point\n  s = skew (usually 0)\n\nDistortion:\n  radial: k1, k2, k3\n  tangential: p1, p2\n  x_dist = x(1 + k1 r^2 + k2 r^4 + k3 r^6) + 2 p1 x y + p2 (r^2 + 2 x^2)\n\nZhang's method:\n  planar target, multiple views\n  homography per view\n  constraints from orthogonality of rotation columns\n  solve for K, then R, t, distortion\n\nPose from K and correspondences:\n  PnP (Perspective-n-Point)\n  EPnP, DLT, iterative\n\nStereo:\n  rectify images so epipolar lines are horizontal\n  disparity -> depth: Z = f * B / d",
 uses:"3D reconstruction, AR, robotics, autonomous driving.",
 strength:"Well-understood model. Recovers accurate intrinsics from few images.",
 limits:"Requires a calibration target. Distortion model may not fit wide-angle lenses.",
 pitfall:"Ignoring distortion in downstream geometry. Straight lines become curves and homographies fail.",
 question:"What does the intrinsic matrix K contain?",
 answer:"Focal lengths fx, fy, the principal point (cx, cy) and skew. It maps normalised camera coordinates to pixel coordinates.",
 demo:"none",sample:"",refs:[
  ["Zhang, A flexible new technique for camera calibration, IEEE TPAMI 2000","https://doi.org/10.1109/34.888718"],
  ["Hartley and Zisserman, Multiple View Geometry, Chapter 6","https://www.cambridge.org/core/books/multiple-view-geometry-in-computer-vision/"],
  ["OpenCV, camera calibration","https://docs.opencv.org/4.x/dc/dbb/tutorial_py_calibration.html"]]},
{id:"ransac-registration",title:"RANSAC and image registration",level:4,kind:"Geometry",status:"Runnable teaching lab",
 summary:"RANSAC fits a model to data with outliers by repeatedly sampling minimal subsets. Image registration aligns two images using a geometric transform estimated from correspondences.",
 mental:"Guess, count inliers, repeat. Keep the best guess.",
 mentalText:"Each iteration samples the minimum number of points, fits the model, and counts inliers. The model with the most inliers wins.",
 steps:["Choose the minimal subset size.","Sample random subsets.","Fit the model.","Count inliers within a threshold.","Repeat for N iterations.","Refine using all inliers."],
 pseudo:"RANSAC:\n  best_model = None, best_inliers = 0\n  for i in 1..N:\n    sample minimal subset S\n    model = fit(S)\n    inliers = points within threshold of model\n    if |inliers| > best_inliers:\n      best_model = model; best_inliers = inliers\n  refine with all inliers\n\nNumber of iterations:\n  N = log(1 - p) / log(1 - w^s)\n  p = desired success probability\n  w = inlier ratio\n  s = minimal subset size\n\nExample: w = 0.5, s = 4, p = 0.99\n  N = log(0.01) / log(1 - 0.5^4) = ~72\n\nImage registration:\n  feature-based: match keypoints, estimate transform\n  intensity-based: optimise a similarity metric\n  metrics: SSD, NCC, mutual information\n\nTransform types (in order of complexity):\n  translation (2 DOF)\n  rigid (3 DOF: tx, ty, theta)\n  similarity (4 DOF: + scale)\n  affine (6 DOF)\n  homography (8 DOF)\n\nApplications:\n  panorama\n  medical image alignment\n  satellite imagery\n  super-resolution\n  change detection",
 uses:"Panorama, medical imaging, satellite, super-resolution, SLAM.",
 strength:"Robust to >50% outliers. Simple to implement.",
 limits:"Requires a threshold and iteration count. Not optimal, only robust.",
 pitfall:"Using a threshold that is too small. Inliers are missed and the model is overfit to the minimal subset.",
 question:"What does RANSAC assume?",
 answer:"That the inliers fit a model and the outliers do not. Sampling a minimal subset of inliers is enough to fit the model.",
 demo:"ransac",sample:"50\n0.4\n0.2",refs:[
  ["Fischler and Bolles, Random sample consensus, CACM 1981","https://doi.org/10.1145/358669.358692"],
  ["Zitová and Flusser, Image registration methods: a survey, Image and Vision Computing 2003","https://doi.org/10.1016/S0262-8856(03)00137-9"],
  ["scikit-image, registration","https://scikit-image.org/docs/stable/auto_examples/transform/plot_matching.html"]]},
/* Ch 8 */
{id:"feature-stitch",title:"Feature matching and panorama stitching",level:5,kind:"Stitching",status:"Concept lesson",
 summary:"Panorama stitching matches features between overlapping images, estimates homographies, warps onto a common plane, and blends. Exposure compensation equalises brightness.",
 mental:"Match, warp, blend",
 mentalText:"Features link images. A homography aligns each image to a reference. Blending hides the seams and exposure differences.",
 steps:["Detect and describe features in each image.","Match features with a ratio test.","Estimate homographies with RANSAC.","Choose a reference image and warp the others.","Blend with multi-band or feathering.","Compensate exposure."],
 pseudo:"Pipeline:\n  1. features (SIFT/ORB) per image\n  2. match with ratio test and mutual nearest\n  3. RANSAC homography per pair\n  4. choose a reference (usually the middle image)\n  5. warp all images onto the reference\n  6. find seams or blend with multi-band\n  7. exposure compensation (gain, gamma)\n\nBundle adjustment (optional):\n  minimise reprojection error over all camera poses\n  and 3D points jointly\n\nBlending methods:\n  feathering: linear ramp across the overlap\n  multi-band: Laplacian pyramid blend\n  seam finding: min-cost path in the overlap\n\nExposure compensation:\n  gain model: I' = g * I\n  gamma: I' = I^gamma\n  solve least squares over overlap pairs\n\nProjection:\n  cylindrical: for wide panoramas\n  spherical: 360 panoramas\n  planar: for small field of view",
 uses:"Phone panoramas, 360 capture, satellite mosaics, medical stitching.",
 strength:"Automatic from features. Produces seamless wide-angle images.",
 limits:"Parallax breaks the single-homography assumption. Moving objects create ghosts.",
 pitfall:"Ignoring parallax. Objects at different depths do not align with a single homography. Use seam finding or multi-band blending.",
 question:"Why is bundle adjustment used in stitching?",
 answer:"It minimises the total reprojection error across all images jointly, correcting drift that accumulates from pairwise homographies.",
 demo:"none",sample:"",refs:[
  ["Brown and Lowe, Automatic panoramic image stitching using invariant features, IJCV 2007","https://doi.org/10.1007/s11263-006-0002-3"],
  ["Szeliski, Image alignment and stitching: a tutorial, 2006","https://doi.org/10.1561/0600000009"],
  ["Burt and Adelson, A multiresolution spline with application to image mosaics, TOG 1983","https://doi.org/10.1145/245.247"]]},
{id:"bundle-adjustment",title:"Bundle adjustment",level:5,kind:"Optimisation",status:"Concept lesson",
 summary:"Bundle adjustment jointly optimises camera parameters and 3D point positions to minimise reprojection error. It is the gold standard for structure from motion.",
 mental:"Adjust cameras and points until the projections line up",
 mentalText:"The cost is the sum of squared distances between observed and projected points. Levenberg-Marquardt solves the sparse least squares.",
 steps:["Initialise cameras and 3D points.","Compute reprojection error.","Linearise with the Jacobian.","Solve the normal equations with Levenberg-Marquardt.","Update and repeat."],
 pseudo:"Cost:\n  E = sum_i sum_j || x_ij - pi(P_i, X_j) ||^2\n  pi = projection from camera pose P_i and 3D point X_j\n\nNormal equations:\n  (J^T J + lambda I) delta = J^T r\n  J is sparse: each residual touches one camera and one point\n\nSchur complement:\n  split into camera and point blocks\n  eliminate points, solve for cameras\n  back-substitute for points\n  reduces the problem size dramatically\n\nLevenberg-Marquardt:\n  lambda controls trust region\n  lambda up: gradient descent\n  lambda down: Gauss-Newton\n\nObservability:\n  gauge freedom: fix one camera or the scale\n  otherwise the system is rank-deficient\n\nLibraries:\n  Ceres Solver, g2o, GTSAM\n  used by COLMAP, OpenSfM, Google Street View",
 uses:"Structure from motion, SLAM, photogrammetry, AR.",
 strength:"Optimal in the least-squares sense. Handles missing data naturally.",
 limits:"Requires a good initialisation. Local minima. Expensive for large scenes.",
 pitfall:"Poor initialisation. Bundle adjustment converges to a bad local minimum. Use a robust initial estimate.",
 question:"Why is bundle adjustment sparse?",
 answer:"Each reprojection error involves only one camera and one 3D point. The Jacobian has very few non-zero entries.",
 demo:"none",sample:"",refs:[
  ["Triggs et al., Bundle adjustment — a modern synthesis, ICCV 1999","https://doi.org/10.1007/3-540-44480-7_21"],
  ["Hartley and Zisserman, Multiple View Geometry, Chapter 18","https://www.cambridge.org/core/books/multiple-view-geometry-in-computer-vision/"],
  ["Agarwal et al., Ceres Solver","http://ceres-solver.org/"]]},
{id:"blending-seam",title:"Blending and seam finding",level:4,kind:"Stitching",status:"Concept lesson",
 summary:"Multi-band blending and seam finding merge overlapping images without visible seams. Multi-band blends in a Laplacian pyramid. Seam finding uses a min-cost path in the overlap region.",
 mental:"Blend smoothly, or find the best cut line",
 mentalText:"Feathering ramps across the overlap. Multi-band blends each frequency band separately. Seam finding cuts along the least visible path.",
 steps:["Compute the overlap region.","Feathering: linear alpha ramp.","Multi-band: Laplacian pyramid of each image, per-band weighted blend, reconstruct.","Seam finding: cost = difference, shortest path."],
 pseudo:"Feathering:\n  alpha = distance to the edge / overlap width\n  out = alpha * A + (1 - alpha) * B\n\nMulti-band blending:\n  build Laplacian pyramid of A and B (L levels)\n  build Gaussian pyramid of the mask\n  blend each level: L_A * G + L_B * (1 - G)\n  reconstruct from the blended pyramid\n\nSeam finding (min-cost path):\n  cost(p) = |A(p) - B(p)|\n  shortest path from top to bottom (or left to right)\n  use the seam as the cut between A and B\n\nExposure compensation:\n  gain: solve least squares over overlaps\n  gamma: I' = I^gamma\n  histogram matching\n\nApplications:\n  panorama\n  medical image mosaics\n  satellite imagery\n  texture synthesis",
 uses:"Any image composition task with multiple sources.",
 strength:"Multi-band handles exposure and blur differences. Seam finding avoids ghosting.",
 limits:"Multi-band needs a mask. Seam finding fails with strong texture in the overlap.",
 pitfall:"Using a hard seam through a textured region. The seam is visible. Multi-band hides it better.",
 question:"Why does multi-band blending reduce visible seams?",
 answer:"It blends low frequencies over a wide region and high frequencies over a narrow one. This matches how the human eye perceives seams.",
 demo:"none",sample:"",refs:[
  ["Burt and Adelson, A multiresolution spline with application to image mosaics, TOG 1983","https://doi.org/10.1145/245.247"],
  ["Efros and Freeman, Image quilting for texture synthesis and transfer, SIGGRAPH 2001","https://doi.org/10.1145/383259.383296"],
  ["Pérez, Gangnet, Blake, Poisson image editing, SIGGRAPH 2003","https://doi.org/10.1145/882262.882269"]]},
/* Ch 9 */
{id:"lucas-kanade",title:"Lucas-Kanade optical flow",level:4,kind:"Motion",status:"Runnable teaching lab",
 summary:"Lucas-Kanade estimates the displacement of small patches between two frames. It assumes constant brightness and small motion, and solves a 2x2 least squares per patch.",
 mental:"Track a small window from frame to frame",
 mentalText:"The brightness constancy constraint gives one equation per pixel. A window gives more equations than unknowns, so it is solvable.",
 steps:["Compute spatial gradients Ix, Iy.","Compute temporal gradient It.","Assemble the structure tensor per patch.","Solve for (u, v).","Use pyramids for large motion."],
 pseudo:"Brightness constancy:\n  I(x + u, y + v, t + 1) = I(x, y, t)\n  Taylor expand:\n    Ix u + Iy v + It = 0\n\nAperture problem:\n  one equation, two unknowns\n  use a window to get more equations\n\nLucas-Kanade:\n  A = [Ix(p) Iy(p)] for p in window\n  b = -It(p)\n  solve (A^T A) [u v] = A^T b\n  A^T A = structure tensor\n\nSolvability:\n  A^T A must be well-conditioned\n  both eigenvalues large (corner-like patch)\n\nPyramidal LK:\n  estimate at coarse level\n  warp and refine at finer level\n  handles motion larger than the window\n\nIterative refinement:\n  warp I2 to I1 by current (u, v)\n  compute the residual\n  update\n\nApplications:\n  tracking, visual odometry, video stabilisation",
 uses:"Tracking, visual odometry, video stabilisation, structure from motion.",
 strength:"Fast, accurate for small motion. Simple to implement.",
 limits:"Only small motion. Fails at boundaries and textureless regions.",
 pitfall:"Running LK on a single scale. Large motion breaks the linear assumption. Use pyramids.",
 question:"Why does Lucas-Kanade need a window?",
 answer:"The aperture problem means each pixel gives one equation with two unknowns. A window adds more equations so the system is solvable.",
 demo:"lk",sample:"128\n2.5\n1.5\n3",refs:[
  ["Lucas and Kanade, An iterative image registration technique with an application to stereo vision, IJCAI 1981","https://www.ijcai.org/Proceedings/81-2/Papers/028.pdf"],
  ["Baker and Matthews, Lucas-Kanade 20 years on: a unifying framework, IJCV 2004","https://doi.org/10.1023/B:VISI.0000011205.11775.fd"],
  ["Bouguet, Pyramidal implementation of the affine Lucas-Kanade feature tracker, Intel 2001","https://www.researchgate.net/publication/247391160"]]},
{id:"horn-schunck",title:"Horn-Schunck and dense optical flow",level:5,kind:"Motion",status:"Concept lesson",
 summary:"Horn-Schunck computes dense optical flow by minimising brightness constancy plus a smoothness term. It is variational and produces a flow field for every pixel.",
 mental:"Global smoothness regularises the aperture problem",
 mentalText:"The smoothness term assumes neighbouring pixels have similar flow. This fills in regions where the brightness constraint is weak.",
 steps:["Write the energy: brightness + smoothness.","Take the Euler-Lagrange equations.","Iterate the update rule.","Use coarse-to-fine for large motion."],
 pseudo:"Energy:\n  E = sum (Ix u + Iy v + It)^2 + alpha (|grad u|^2 + |grad v|^2)\n\nEuler-Lagrange:\n  (Ix^2 + alpha) u + Ix Iy v = alpha u_avg - Ix It\n  Ix Iy u + (Iy^2 + alpha) v = alpha v_avg - Iy It\n\nIterative update:\n  u = u_avg - Ix (Ix u_avg + Iy v_avg + It) / (alpha + Ix^2 + Iy^2)\n  v = v_avg - Iy (Ix u_avg + Iy v_avg + It) / (alpha + Ix^2 + Iy^2)\n\nCoarse-to-fine:\n  downsample both images\n  estimate flow at coarse level\n  upsample and refine\n\nModern methods:\n  TV-L1, deep flow (FlowNet, PWC-Net, RAFT)\n  RAFT is currently state-of-the-art on many benchmarks\n\nBenchmarks:\n  Middlebury, KITTI, Sintel",
 uses:"Motion analysis, video compression, autonomous driving, action recognition.",
 strength:"Dense flow. Well-founded. Simple to implement.",
 limits:"Smoothness blurs motion boundaries. Very slow to converge without pyramids.",
 pitfall:"Using Horn-Schunck on a scene with strong motion discontinuities. Flow leaks across object boundaries.",
 question:"What does the smoothness term do?",
 answer:"It penalises large flow gradients. This fills in the aperture problem in textureless regions but blurs motion boundaries.",
 demo:"none",sample:"",refs:[
  ["Horn and Schunck, Determining optical flow, Artificial Intelligence 1981","https://doi.org/10.1016/0004-3702(81)90024-2"],
  ["Zach, Pock, Bischof, A duality based approach for realtime TV-L1 optical flow, DAGM 2007","https://doi.org/10.1007/978-3-540-74936-3_22"],
  ["Teed and Deng, RAFT: recurrent all-pairs field transforms for optical flow, ECCV 2020","https://doi.org/10.1007/978-3-030-58536-5_24"]]},
{id:"stereo-sgbm",title:"Stereo matching and semi-global matching",level:5,kind:"Depth",status:"Runnable teaching lab",
 summary:"Stereo matching finds corresponding points in a rectified stereo pair. The disparity gives depth. Semi-global matching (SGM) aggregates costs along multiple 1D paths.",
 mental:"Find the same point in the left and right images",
 mentalText:"After rectification, the epipolar lines are horizontal. Matching reduces to a 1D search. Disparity d gives depth Z = f B / d.",
 steps:["Rectify the stereo pair.","Compute per-pixel matching costs (Census, MI, SAD).","Aggregate costs along paths (SGM).","Pick the minimum-cost disparity.","Refine with subpixel and consistency checks."],
 pseudo:"Rectification:\n  epipolar lines become horizontal\n  left and right pixels at the same row\n\nDisparity and depth:\n  d = x_left - x_right\n  Z = f * B / d\n\nCost:\n  SAD: sum |I_L(p) - I_R(p - d)|\n  Census: Hamming distance of census transforms\n  Mutual information\n\nSGM:\n  for each of 8 or 16 directions r:\n    L_r(p, d) = C(p, d) + min(\n        L_r(p - r, d),\n        L_r(p - r, d - 1) + P1,\n        L_r(p - r, d + 1) + P1,\n        min_k L_r(p - r, k) + P2\n      ) - min_k L_r(p - r, k)\n  S(p, d) = sum_r L_r(p, d)\n  d*(p) = argmin_d S(p, d)\n\nConsistency check:\n  left-right consistency: d_L(p) == d_R(p - d_L(p))\n  otherwise mark as occluded\n\nSubpixel:\n  parabolic fit around the minimum\n\nModern:\n  deep stereo (PSMNet, RAFT-Stereo, CREStereo)",
 uses:"Autonomous driving, robotics, depth sensing, 3D reconstruction.",
 strength:"SGM is accurate and efficient. Global-ish aggregation without a full MRF solve.",
 limits:"Parameters P1, P2 need tuning. Fails in textureless and reflective regions.",
 pitfall:"Ignoring rectification. Matching along epipolar lines requires them to be horizontal. Always rectify first.",
 question:"Why does rectification simplify stereo matching?",
 answer:"It makes epipolar lines horizontal. The search for a match becomes 1D along the same row instead of 2D.",
 demo:"stereo",sample:"128\n3.0\n40",refs:[
  ["Hirschmüller, Stereo processing by semiglobal matching and mutual information, IEEE TPAMI 2008","https://doi.org/10.1109/TPAMI.2007.1166"],
  ["Scharstein and Szeliski, A taxonomy and evaluation of dense two-frame stereo correspondence algorithms, IJCV 2002","https://doi.org/10.1023/A:1014573219977"],
  ["Middlebury stereo benchmark","https://vision.middlebury.edu/stereo/"]]},
/* Ch 10 */
{id:"sfm",title:"Structure from motion",level:5,kind:"3D reconstruction",status:"Concept lesson",
 summary:"Structure from motion (SfM) recovers camera poses and 3D point positions from a set of images. The pipeline is: features, matching, tracks, initial pair, incremental or global reconstruction, bundle adjustment.",
 mental:"Move a camera around an object and reconstruct it",
 mentalText:"Feature tracks link points across images. The initial pair gives a baseline. Additional images are added and everything is refined by bundle adjustment.",
 steps:["Detect and describe features in every image.","Match features across images (with ratio test and verification).","Build tracks (a 3D point seen in many images).","Choose an initial pair with a good baseline.","Triangulate, then add more images one by one.","Bundle adjust and remove outliers."],
 pseudo:"Pipeline:\n  1. features: SIFT or learned (SuperPoint)\n  2. matching: nearest neighbour + ratio + geometric verification\n  3. tracks: connected components of matches\n  4. initial pair: high inliers, wide baseline\n  5. incremental:\n     - PnP to localise new images\n     - triangulate new points\n     - bundle adjustment\n  6. global SfM: solve all rotations, then translations\n\nTriangulation:\n  given two views and a correspondence, solve for X\n  X = argmin sum ||pi(P_i, X) - x_i||^2\n\nTwo-view geometry:\n  essential matrix E = [t]_x R\n  x2^T E x1 = 0\n  decompose E into R and t (4 candidates)\n\nGlobal SfM:\n  rotation averaging: solve for all R_i\n  translation averaging: solve for t_i\n  bundle adjustment at the end\n\nLibraries:\n  COLMAP, OpenSfM, Theia, OpenMVG",
 uses:"Photogrammetry, AR, cultural heritage, autonomous driving maps.",
 strength:"Works with unordered images. No calibration target required if intrinsics are known.",
 limits:"Fails on degenerate motion (pure rotation). Scale is unknown without metric reference.",
 pitfall:"Choosing a bad initial pair. Wide baseline and strong parallax are needed. Pure rotation gives no triangulation.",
 question:"Why does SfM need two views with a baseline?",
 answer:"Triangulation requires parallax. If the camera only rotates, no point has measurable depth.",
 demo:"none",sample:"",refs:[
  ["Hartley and Zisserman, Multiple View Geometry, 2nd ed., Cambridge 2004","https://www.cambridge.org/core/books/multiple-view-geometry-in-computer-vision/"],
  ["Schönberger and Frahm, Structure-from-motion revisited, CVPR 2016","https://doi.org/10.1109/CVPR.2016.445"],
  ["Özyeşil et al., A survey of structure from motion, Acta Numerica 2017","https://doi.org/10.1017/S096249291700006X"]]},
{id:"mvs-photogrammetry",title:"Multi-view stereo and photogrammetry",level:5,kind:"3D reconstruction",status:"Concept lesson",
 summary:"Multi-view stereo (MVS) takes known camera poses and produces a dense 3D reconstruction. PatchMatch MVS and depth map fusion are common approaches.",
 mental:"Many calibrated views, one dense reconstruction",
 mentalText:"For each pixel, find the depth that matches the most other views. Fuse the depth maps into a point cloud or mesh.",
 steps:["Take SfM output: camera poses and sparse points.","For each reference image, compute a depth map.","Use PatchMatch or another stereo method to search for depth.","Fuse depth maps into a consistent 3D model.","Build a mesh (Poisson, Delaunay)."],
 pseudo:"Per-view depth estimation:\n  reference image I_ref with camera P_ref\n  source images I_src with cameras P_src\n  for each pixel p in I_ref:\n    for candidate depths d:\n      project p to all sources\n      compute photometric consistency\n    pick the depth with the best score\n\nPatchMatch:\n  random init, propagation, random search\n  fast approximate nearest neighbour in depth space\n\nPhotometric consistency:\n  NCC over a small patch across sources\n\nMulti-view cost:\n  cost(p, d) = sum_s rho(NCC(p, d, s))\n\nFusion (Furukawa-Ponce, Delaunay):\n  visibility consistency\n  free-space violation\n  merge into a coherent surface\n\nPoisson reconstruction:\n  solve for a scalar function whose gradient matches the surface normals\n  extract an isosurface\n\nMeshing:\n  Poisson, Ball-pivoting, Marching Cubes, Delaunay\n\nLibraries:\n  COLMAP, OpenMVS, Meshroom (AliceVision)",
 uses:"Cultural heritage, game assets, film VFX, drone mapping.",
 strength:"Dense, accurate. Works with consumer cameras.",
 limits:"Requires good SfM. Fails on textureless, specular or transparent surfaces.",
 pitfall:"Feeding MVS bad camera poses. Errors in SfM propagate directly to the reconstruction.",
 question:"What does MVS need from SfM?",
 answer:"Camera poses (intrinsics and extrinsics) for every image. MVS uses them to project pixels across views.",
 demo:"none",sample:"",refs:[
  ["Furukawa and Ponce, Accurate, dense, and robust multi-view stereopsis, IEEE TPAMI 2010","https://doi.org/10.1109/TPAMI.2009.161"],
  ["Schönberger et al., Pixelwise view selection for unstructured multi-view stereo, ECCV 2016","https://doi.org/10.1007/978-3-319-46487-9_31"],
  ["Kazhdan and Hoppe, Screened Poisson surface reconstruction, TOG 2013","https://doi.org/10.1145/2487228.2487237"]]},
{id:"point-clouds-meshing",title:"Point clouds and meshing",level:5,kind:"3D reconstruction",status:"Concept lesson",
 summary:"A point cloud is an unstructured set of 3D points, often with normals and colour. Meshing converts a point cloud into a surface. Common methods: Poisson, Ball-pivoting, Delaunay, Marching Cubes.",
 mental:"A cloud of points, then a surface through them",
 mentalText:"Meshing needs normals and enough density. Poisson solves for a smooth surface. Delaunay-based methods interpolate through points.",
 steps:["Estimate normals (PCA on k neighbours).","Orient normals consistently.","Build a mesh (Poisson, Ball-pivoting, Delaunay).","Simplify and texture."],
 pseudo:"Normal estimation:\n  k nearest neighbours of p\n  compute the covariance matrix\n  smallest eigenvector is the normal\n\nNormal orientation:\n  propagate from a seed using a minimum spanning tree\n  or orient towards the viewpoint\n\nPoisson reconstruction:\n  define an indicator function chi\n  grad chi = vector field of normals\n  solve the Poisson equation\n  extract the isosurface via Marching Cubes\n\nMarching Cubes:\n  for each cube of 8 voxels, look up the case\n  256 cases, 15 up to symmetry\n  emit triangles\n\nBall-pivoting:\n  roll a ball of radius r over the points\n  the pivoting ball traces the surface\n\nDelaunay / alpha shapes:\n  Delaunay tetrahedralisation\n  filter tetrahedra by size or alpha\n\nSimplification:\n  quadric error metrics (QEM)\n  vertex clustering\n  edge collapse\n\nFormats:\n  PLY, OBJ, XYZ, LAS",
 uses:"3D scanning, AR, CAD, heritage, gaming.",
 strength:"Poisson gives a smooth watertight surface from noisy data.",
 limits:"Poisson smooths sharp features. Delaunay needs clean data. Marching Cubes is memory-heavy.",
 pitfall:"Feeding unoriented normals to Poisson. The vector field is inconsistent and the surface is wrong.",
 question:"Why must normals be consistently oriented before meshing?",
 answer:"Meshing methods assume the normals point outward. Inconsistent normals break the vector field and produce a bad surface.",
 demo:"none",sample:"",refs:[
  ["Kazhdan, Bolitho, Hoppe, Poisson surface reconstruction, SGP 2006","https://doi.org/10.2312/SGP/SGP06/061-070"],
  ["Lorensen and Cline, Marching cubes: a high resolution 3D surface construction algorithm, SIGGRAPH 1987","https://doi.org/10.1145/37401.37422"],
  ["Bernardini et al., The ball-pivoting algorithm for surface reconstruction, IEEE TVCG 1999","https://doi.org/10.1109/2945.817351"]]},
