<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<meta name="description" content="aznur / vision lab — a single-file, privacy-first course on image processing and computer vision with runnable in-browser labs">
<title>aznur / vision lab</title>
<style>
/* ============ design tokens ============ */
:root{
  --font:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --radius:4px;--radius-sm:3px;--radius-lg:6px;color-scheme:dark;
  --bg:#161313;--panel:#1c1818;--panel2:#211d1d;--panel3:#211d1d;
  --line:#302c2c;--line2:#454040;--text:#f1eeee;--muted:#9a9898;--subtle:#646262;
  --accent:#f59e0b;--accent-hover:#d97706;--good:#10b981;--warn:#f59e0b;--bad:#f87171;
  --lab-bg:#141110;--lab-deep:#0f0d0b;--lab-toolbar:#151210;--lab-border:#2a2620;
  --lab-text:#f5f5f4;--lab-muted:#a8a29e;--lab-amber:#fbbf24;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#fdfcfc;--panel:#faf8f7;--panel2:#f4f0ef;--panel3:#f4f0ef;
  --line:#dcd9d9;--line2:#c9c4c4;--text:#201d1d;--muted:#646262;--subtle:#9a9898;
  --accent:#b45309;--accent-hover:#92400e;--good:#10b981;--warn:#b45309;--bad:#b91c1c;
  --lab-toolbar:#1a1613;--lab-amber:#f59e0b;
}
/* ============ base ============ */
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.55 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;font-family:var(--font)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover);text-decoration:underline}
h1,h2,h3,h4{font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)}.mono,code,pre,textarea{font-family:var(--font)}
/* ============ topbar ============ */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:56px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:6px;color:var(--text);min-width:0;font-size:12.5px}
.brand:hover{text-decoration:none}.brand strong{font-weight:600;font-size:12.5px;color:var(--text)}
.brand-slash{color:var(--subtle)}.brand-title{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-meta{flex:1;min-width:0;color:var(--subtle);font-size:10.5px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.top-actions label{font-size:10px;color:var(--subtle);text-transform:uppercase;letter-spacing:.1em}
/* ============ controls ============ */
select,.btn{border:1px solid var(--line2);background:var(--panel3);color:var(--text);border-radius:var(--radius);padding:6px 10px;font-size:11.5px;line-height:1.3}
.btn{font-weight:500;white-space:nowrap;transition:border-color .12s,color .12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#161313;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#161313}
:root[data-theme=light] .btn.primary,:root[data-theme=light] .btn.primary:hover{color:#fdfcfc}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seed{width:76px;border:1px solid var(--line2);background:var(--panel3);color:var(--text);border-radius:var(--radius);padding:5px 8px;font-size:11.5px}
/* ============ layout ============ */
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);max-width:1440px;margin:0 auto;min-height:calc(100vh - 56px)}
.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;min-width:0}
.side-title{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;color:var(--subtle);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.pill,.tag{border:1px solid var(--line2);border-radius:var(--radius-sm);padding:2px 6px;font-size:9.5px;color:var(--muted);white-space:nowrap;font-weight:500;letter-spacing:.02em}
.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,var(--line2))}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line2))}
.search{display:flex;gap:6px;align-items:center;height:32px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel3);margin-bottom:10px;color:var(--subtle);font-size:11px}
.search input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font-size:11.5px;padding:0}
.search input::placeholder{color:var(--subtle)}
.search kbd{border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 5px;font-size:9.5px;color:var(--subtle);background:var(--bg)}
.filter{display:block;color:var(--subtle);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;font-weight:500}
.filter select{display:block;width:100%;margin-top:5px;padding:6px 8px;font-size:11px;text-transform:none;letter-spacing:0}
.check{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:10.5px;margin-bottom:12px;cursor:pointer}
.check input{accent-color:var(--accent)}
.tree{display:flex;flex-direction:column;gap:12px;min-width:0}
.group-label{display:flex;justify-content:space-between;color:var(--subtle);font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 6px}
.link{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 8px;border-radius:var(--radius);min-height:30px;transition:background .1s,color .1s,border-color .1s}
.link .num{font-size:9.5px;color:var(--subtle);width:20px;flex:none}
.link .name{flex:1;min-width:0;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link .done{color:var(--good);font-size:11px}.link .bm{color:var(--accent);font-size:10px}
.link:hover{background:var(--panel2);color:var(--text)}
.link.active{background:var(--panel2);border-color:var(--line2);color:var(--text)}
.link.active .name{font-weight:500}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.progress-row{display:flex;justify-content:space-between;color:var(--subtle);font-size:10px;letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase}
.progress-row strong{color:var(--text);font-weight:500}
.progress{height:4px;background:var(--panel3);border-radius:2px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);transition:width .25s ease}
.side-actions{display:flex;gap:6px;margin-top:10px}
.side-actions .btn{flex:1;padding:5px 6px;font-size:10.5px}
/* ============ main ============ */
main{max-width:900px;width:100%;min-width:0;margin:0 auto;padding:24px 28px 40px}
.breadcrumb{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--subtle);margin-bottom:14px}
.header{padding:2px 0 20px;border-bottom:1px solid var(--line);margin-bottom:18px}
.eyebrow{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;font-weight:600;color:var(--accent);margin-bottom:8px}
.header h1{font-size:22px;line-height:1.2;margin:0 0 10px;font-weight:600}
.header p{font-size:13px;color:var(--muted);margin:0 0 12px;max-width:720px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.header-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
/* ============ panels ============ */
.panel{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
.panel-head{padding:14px 16px 0}
.panel-head h2{font-size:12.5px;margin:0 0 3px;font-weight:600}
.panel-head p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.55}
.body{padding:12px 16px 16px}
.idea{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:18px}
.idea p{font-size:12.5px;color:var(--muted);margin:0 0 11px;line-height:1.6}
.mental{background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius);padding:11px}
.mental small{display:block;color:var(--subtle);font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.mental strong{display:block;margin:5px 0;font-size:12px;color:var(--text);font-weight:600;line-height:1.4}
.mental p{font-size:11px;color:var(--muted);margin:0;line-height:1.55}
.takeaway{padding:10px 12px;border:1px solid var(--line2);background:var(--panel3);border-radius:var(--radius);color:var(--text);font-size:12px;line-height:1.6}
.takeaway strong{color:var(--accent);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px}
.mini h3{font-size:11.5px;margin:0 0 6px;font-weight:600}
.mini p{font-size:11.5px;color:var(--muted);margin:0;line-height:1.6}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.steps li{counter-increment:s;display:flex;gap:9px;font-size:11.5px;color:var(--muted);line-height:1.55}
.steps li:before{content:counter(s);flex:none;width:20px;height:20px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--panel3);color:var(--accent);font-size:10px;margin-top:1px}
.pseudo{white-space:pre-wrap;overflow:auto;background:var(--lab-bg);color:var(--lab-text);border:1px solid var(--lab-border);border-radius:var(--radius);padding:12px 14px;font:11.5px/1.7 var(--font);margin:0}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:11.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);font-weight:600;background:var(--panel3)}
td{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:10px 11px;background:var(--panel3);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.tile span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--subtle);font-weight:600;margin-bottom:4px}
.tile strong{display:block;color:var(--text);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.tile small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.5}
.notice{padding:10px 12px;background:var(--panel3);border:1px solid color-mix(in srgb,var(--warn) 32%,var(--line));border-radius:var(--radius);font-size:11.5px;color:var(--muted);line-height:1.6}
.notice strong{color:var(--warn);font-weight:600}
.notice.info{border-color:var(--line2)}.notice.info strong{color:var(--accent)}
/* ============ visual lab (always dark) ============ */
.lab-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab-top label{font-size:10px;color:var(--subtle);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.lab-input{display:block;width:100%;min-height:90px;resize:vertical;background:var(--lab-bg);border:1px solid var(--lab-border);border-radius:var(--radius);padding:10px 12px;color:var(--lab-text);font:11.5px/1.6 var(--font);margin:10px 0}
.lab-input:focus-visible{outline-color:var(--lab-amber);border-color:var(--lab-amber)}
.lab-plot{background:var(--lab-deep);border:1px solid var(--lab-border);border-radius:var(--radius);padding:10px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.plot{width:100%;height:auto;display:block}
.img-row{display:flex;flex-wrap:wrap;gap:10px}
.img-cell{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.img-cell img{max-width:236px;width:100%;height:auto;image-rendering:pixelated;border:1px solid var(--lab-border);border-radius:var(--radius-sm);background:var(--lab-deep)}
.img-cell figcaption{font-size:9px;color:var(--lab-muted);letter-spacing:.04em}
.swatch{width:120px;height:64px;border:1px solid var(--lab-border);border-radius:var(--radius-sm)}
.lab-output{padding:12px 14px;background:var(--lab-deep);border:1px solid var(--lab-border);border-radius:var(--radius);min-height:80px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--lab-text);font:11.5px/1.7 var(--font);overflow-x:auto}
.lab-cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;margin-top:12px}
.label{font-size:9px;color:var(--subtle);letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:5px}
.lab-status{margin-top:10px;font-size:10px;color:var(--subtle);letter-spacing:.04em}
.lab-status[data-state=err]{color:var(--bad)}
.lab-status[data-state=ok]{color:var(--good)}
/* ============ code workshop (always dark) ============ */
.code-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 12px;background:var(--lab-toolbar);border-bottom:1px solid var(--lab-border)}
.code-head .tag{border-color:var(--lab-border);color:var(--lab-muted);background:transparent}
.code-head .btn{background:transparent;border-color:var(--lab-border);color:var(--lab-text);padding:4px 8px;font-size:10.5px}
.code-head .btn:hover{border-color:var(--lab-amber);color:var(--lab-amber)}
.code-editor{display:block;width:100%;min-height:220px;resize:vertical;border:0;border-radius:0;background:var(--lab-bg);color:var(--lab-text);padding:14px 16px;font:11.5px/1.7 var(--font);outline:0}
.code-editor:focus-visible{outline:2px solid var(--lab-amber);outline-offset:-2px}
.code-foot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 12px;color:var(--lab-muted);font-size:10px;border-top:1px solid var(--lab-border);background:var(--lab-toolbar);flex-wrap:wrap}
/* ============ misc ============ */
.practice{border:1px solid var(--line);background:var(--panel3);border-radius:var(--radius);padding:11px 12px}
.practice summary{cursor:pointer;font-size:12px;font-weight:600;list-style:none;display:flex;align-items:flex-start;gap:8px}
.practice summary::-webkit-details-marker{display:none}
.practice summary::before{content:"?";flex:none;width:18px;height:18px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:var(--radius-sm);color:var(--accent);font-size:10px;font-weight:600}
.practice[open] summary::before{content:"…"}
.practice p{font-size:11.5px;color:var(--muted);margin:9px 0 0;line-height:1.65}
.references{display:flex;flex-direction:column;gap:6px}
.references a{font-size:11.5px;overflow-wrap:anywhere;line-height:1.55}
.home-hero{padding:26px 26px 24px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:14px}
.home-hero h1{font-size:clamp(20px,2.4vw,26px);line-height:1.25;letter-spacing:-.015em;margin:6px 0 12px;font-weight:600}
.home-hero p{color:var(--muted);font-size:12.5px;max-width:680px;margin:0 0 16px;line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;min-width:0}
.stat strong{display:block;font-size:18px;color:var(--text);font-weight:600;line-height:1.1}
.stat span{display:block;font-size:9.5px;color:var(--subtle);margin-top:4px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.chapter-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chapter-card{padding:12px 13px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);color:var(--text);transition:border-color .12s,background .12s;min-width:0}
.chapter-card:hover{border-color:var(--accent);background:var(--panel2)}
.chapter-card .num{font-size:9px;color:var(--accent);letter-spacing:.1em;font-weight:600;text-transform:uppercase}
.chapter-card strong{display:block;font-size:12px;margin:4px 0;font-weight:600;line-height:1.4}
.chapter-card p{font-size:11px;color:var(--muted);margin:0;line-height:1.55}
.toast{position:fixed;z-index:99;bottom:18px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:9px 14px;font-size:11.5px;color:var(--text);box-shadow:0 4px 20px rgba(0,0,0,.15);transition:opacity .14s,transform .14s;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 2px 6px;font-size:10px;color:var(--subtle);border-top:1px solid var(--line);margin-top:20px}
.footer .btn{padding:5px 8px;font-size:10.5px}
/* ============ modal ============ */
.modal-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.modal-overlay[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius-lg);max-width:440px;width:100%;padding:18px}
.modal h2{font-size:13px;margin:0 0 12px}
.modal p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 14px}
.kbd-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.kbd-row:last-of-type{border-bottom:0}
.kbd-row kbd{border:1px solid var(--line2);border-radius:var(--radius-sm);background:var(--panel3);color:var(--text);padding:1px 7px;font-size:10.5px;font-family:var(--font)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* ============ responsive ============ */
@media(max-width:1080px){.layout{grid-template-columns:236px minmax(0,1fr)}main{padding:22px 20px 36px}}
@media(max-width:840px){
  .topbar{height:auto;min-height:56px;flex-wrap:wrap;gap:10px;padding:10px 14px}
  .top-meta{display:none}.top-actions{margin-left:auto}.top-actions label{display:none}
  .layout{display:block}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px}
  .tree{max-height:280px;overflow:auto}.side-foot{display:none}
  main{padding:18px 15px 32px}
  .idea{grid-template-columns:1fr}.mental{order:-1}
  .stats{grid-template-columns:1fr 1fr}
  .chapter-cards,.two,.lab-cols{grid-template-columns:1fr}
  .header h1,.home-hero h1{font-size:20px}
}
@media(max-width:520px){
  .brand{font-size:11.5px}
  .top-actions select{max-width:88px;padding:5px 6px;font-size:10px}
  .top-actions .btn{padding:5px 7px;font-size:10px}
  .chapter-cards,.tiles{grid-template-columns:1fr}
  .home-hero{padding:18px}
  .body,.panel-head{padding-left:13px;padding-right:13px}
  .footer{display:block}.footer span{display:block;margin-bottom:5px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media print{
  .topbar,.sidebar,.header-actions,.lab-top,.btn,.toast,.lab-input,.code-head,.code-foot,.modal-overlay,.seed,.lab-status{display:none!important}
  .layout{display:block}main{padding:0;max-width:none}
  .panel,.home-hero{break-inside:avoid}
  .pseudo,.lab-output,.code-editor,.lab-plot{background:#fff!important;color:#111!important;border-color:#ccc!important}
  .img-cell img{border-color:#ccc}
  body{background:#fff;color:#111}a{color:#111;text-decoration:underline}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#home" id="homeLink"><strong>aznur</strong><span class="brand-slash">/</span><span class="brand-title">vision lab</span></a>
  <div class="top-meta" id="catalogCount"></div>
  <div class="top-actions">
    <label for="themeSelect">Theme</label>
    <select id="themeSelect" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select>
    <button class="btn" id="shortcutsBtn" type="button" aria-label="Keyboard shortcuts">?</button>
    <button class="btn" id="printBtn" type="button">Print / PDF</button>
    <button class="btn" id="exportBtn" type="button">Export</button>
    <button class="btn" id="importBtn" type="button">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</header>

{id:"adaptive-threshold",title:"Adaptive thresholding",level:3,kind:"Segmentation",status:"Runnable teaching lab",
summary:"Adaptive thresholding computes a local threshold per pixel from its neighbourhood. It handles uneven illumination where a global threshold fails.",

pseudo:`Mean adaptive:
T(x, y) = mean(window(x, y)) - C
out(x, y) = 255 if in(x, y) > T else 0

block size : window in pixels, odd

summary:"Morphology operates on binary or grayscale images with a structuring element. Erosion shrinks foreground. Dilation grows it. Opening removes small objects. Closing fills small holes.",

Grayscale dilation: max over SE(p)

open(I, SE) = dilate(erode(I, SE), SE)

Closing:
close(I, SE) = erode(dilate(I, SE), SE)

black_tophat = close(I) - I

{id:"nlm-bm3d",title:"Non-local means and BM3D",level:5,kind:"Denoising",status:"Runnable teaching lab",demoTitle:"Non-local means lab",
summary:"Non-local means (NLM) averages similar patches across the whole image, not just neighbours. BM3D groups similar patches into 3D blocks, applies a transform, and thresholds in the transform domain.",
mental:"Find similar patches everywhere, then average them",
mentalText:"NLM weights each pixel by the similarity of its patch to the target patch. BM3D extends this with a 3D transform and collaborative filtering.",
steps:["NLM: for each pixel, find similar patches.","Weight by patch similarity.","Average.","BM3D: group similar patches into 3D blocks.","Apply 3D transform, threshold, invert.","Aggregate estimates."],
pseudo:`Non-local means:
w(p, q) = exp(-||patch(p) - patch(q)||^2 / h^2)
out[p] = sum_q w(p, q) in[q] / sum_q w(p, q)
h = filter strength

BM3D:
step 1 (hard thresholding):
  group similar patches into a 3D block
  apply 3D transform (DCT + Haar)
  threshold small coefficients, invert
step 2 (Wiener):
  use step 1 as a guide
  Wiener filter in the transform domain

Patch similarity:
L2 distance, search window limits cost

Complexity:
NLM O(H W S^2 P^2), S = search window
BM3D similar with grouping overhead

BM3D is the classical benchmark;
still competitive with CNNs on some benchmarks`,

summary:"Total variation (TV) denoising minimises the L1 norm of the gradient, producing piecewise-constant results. CLAHE is contrast-limited adaptive histogram equalisation, a local contrast enhancer.",
mental:"Smooth except at edges, or boost local contrast without noise",
mentalText:"TV penalises variation, so flat regions become flat and edges are preserved. CLAHE equalises the histogram in tiles with a clip limit.",
steps:["TV: minimise ||u - f||² + λ ||∇u||.","Use a primal-dual or split Bregman method.","CLAHE: divide into tiles.","Equalise each tile's histogram with a clip limit.","Interpolate between tiles."],
pseudo:`Total variation:
min_u 0.5 ||u - f||^2 + lambda * TV(u)
TV(u) = sum |grad u|

Chambolle dual projection:
p <- (p + tau * grad(div p - f/lambda))
     / (1 + tau * |grad(div p - f/lambda)|)
u = f - lambda * div p

TV-L1:
L1 data term, better for salt-and-pepper noise

CLAHE:
divide the image into tiles (8x8 typical)
clip each tile histogram, redistribute excess
equalise, bilinearly interpolate between tiles

Parameters:
tile size, clip limit (higher = more contrast)

{id:"sift-surf",title:"SIFT and SURF",level:5,kind:"Features",status:"Concept lesson",
summary:"SIFT detects scale-space extrema of the difference of Gaussians, assigns orientations, and describes each keypoint with a 128-dim histogram of gradients. SURF approximates this with box filters and Haar wavelets.",
mental:"Find keypoints that survive changes of scale and rotation",
mentalText:"SIFT builds a Gaussian pyramid, finds extrema in the difference of Gaussians, and computes a rotation-invariant descriptor.",
steps:["Build a Gaussian pyramid.","Compute the difference of Gaussians.","Find extrema in 3D (x, y, scale).","Assign orientation from the gradient histogram.","Compute the 128-dim descriptor."],
pseudo:`Scale space:
L(x, y, sigma) = G(x, y, sigma) * I(x, y)
DoG = L(x, y, k sigma) - L(x, y, sigma)

Keypoint detection:
local extrema of DoG in 3D (x, y, sigma)
reject low-contrast and edge-like points

Orientation assignment:
36-bin gradient histogram, peak = orientation

Descriptor:
16x16 window, 4x4 subregions, 8-bin histograms
4 * 4 * 8 = 128 dimensions
normalise, clip at 0.2, renormalise

SURF:
box filters + integral image, Haar wavelets
descriptor 64 or 128 dims

Matching:
nearest neighbour with Lowe's ratio d1/d2 < 0.8`,

summary:"FAST detects corners by comparing a pixel to a circle of neighbours. BRIEF describes patches with binary intensity comparisons. ORB combines FAST with an oriented BRIEF descriptor.",
mental:"Fast corner detection plus a binary descriptor",
mentalText:"FAST is very fast because it only does comparisons. BRIEF uses 256 binary tests. ORB adds orientation and scale for robustness.",
steps:["FAST: for each pixel, check a circle of 16 neighbours.","If 9+ contiguous are all brighter or darker, it is a corner.","Non-maximum suppression to remove duplicates.","ORB: compute orientation from the intensity centroid.","Rotate the BRIEF pattern and compute the binary descriptor."],
pseudo:`FAST-9:
circle of 16 pixels around p, radius 3
if >= 9 contiguous are all > p + t or < p - t:
  p is a corner

FAST score = sum of absolute differences
keep only local maxima

Intensity centroid orientation:
m01 = sum y I(y, x), m10 = sum x I(y, x)
theta = atan2(m01, m10)

BRIEF:
256 pre-defined pixel pairs in a patch
bit i = 1 if I(p_i) < I(q_i)
descriptor = 256 bits = 32 bytes

ORB = oFAST + rBRIEF:
rotate the BRIEF pattern by theta, scale pyramid

Matching:
Hamming distance (popcount on XOR), very fast`,

summary:"The Hough transform votes for parameterised shapes (lines, circles). Peaks in the accumulator are the detected shapes. Template matching slides a patch and computes a similarity score.",

{id:"affine-homography",title:"Affine transforms, homography and DLT",level:4,kind:"Geometry",status:"Runnable teaching lab",demoTitle:"Homography DLT lab",
summary:"An affine transform preserves parallelism. A homography maps between two planes viewed by a pinhole camera. DLT estimates a homography from point correspondences.",
mental:"A 3x3 matrix that warps one image onto another",
mentalText:"The homography has 8 degrees of freedom. Four point correspondences determine it. DLT solves for it linearly.",
steps:["Collect 4+ point correspondences.","Build the DLT matrix.","Solve with SVD.","Normalise.","Warp the image with the homography."],
pseudo:`Affine transform (2x3):
[x']   [a b tx] [x]
[y'] = [c d ty] [y]
[1]               [1]
preserves parallelism, 6 DOF

Homography (3x3):
[x']       [h11 h12 h13] [x]
[y'] ~ H = [h21 h22 h23] [y]
[w ]       [h31 h32 h33] [1]
x' = x/w, y' = y/w, 8 DOF

DLT (h33 = 1):
for each (x, y) -> (u, v):
  [x y 1 0 0 0 -u x -u y] h = u
  [0 0 0 x y 1 -v x -v y] h = v
solve the 8x8 linear system

Normalisation (Hartley):
translate to centroid, scale mean distance to sqrt(2)

RANSAC for homography:
sample 4, estimate H, count inliers, refine

Applications:
document rectification, panorama, AR markers`,

summary:"RANSAC fits a model to data with outliers by repeatedly sampling minimal subsets. Image registration aligns two images using a geometric transform estimated from correspondences.",
mental:"Guess, count inliers, repeat. Keep the best guess.",
mentalText:"Each iteration samples the minimum number of points, fits the model, and counts inliers. The model with the most inliers wins.",

pseudo:`RANSAC:
best_model = None, best_inliers = 0
for i in 1..N:
  sample minimal subset S
  model = fit(S)
  inliers = points within threshold

Number of iterations:
N = log(1 - p) / log(1 - w^s)
p = success probability, w = inlier ratio, s = subset size

{id:"bundle-adjustment",title:"Bundle adjustment",level:5,kind:"Optimisation",status:"Concept lesson",
summary:"Bundle adjustment jointly optimises camera parameters and 3D point positions to minimise reprojection error. It is the gold standard for structure from motion.",
mental:"Adjust cameras and points until the projections line up",
mentalText:"The cost is the sum of squared distances between observed and projected points. Levenberg-Marquardt solves the sparse least squares.",
steps:["Initialise cameras and 3D points.","Compute reprojection error.","Linearise with the Jacobian.","Solve the normal equations with Levenberg-Marquardt.","Update and repeat."],
pseudo:`Cost:
E = sum_i sum_j || x_ij - pi(P_i, X_j) ||^2

Normal equations:
(J^T J + lambda I) delta = J^T r
J is sparse: each residual touches one camera, one point

Schur complement:
eliminate point blocks, solve for cameras,
back-substitute for points

Levenberg-Marquardt:
lambda up   -> gradient descent
lambda down -> Gauss-Newton

Observability:
gauge freedom: fix one camera or the scale

Libraries:

used by COLMAP, OpenSfM, Google Street View`,

{id:"blending-seam",title:"Blending and seam finding",level:4,kind:"Stitching",status:"Runnable teaching lab",demoTitle:"Blending and seam lab",
summary:"Multi-band blending and seam finding merge overlapping images without visible seams. Multi-band blends in a Laplacian pyramid. Seam finding uses a min-cost path in the overlap region.",
mental:"Blend smoothly, or find the best cut line",
mentalText:"Feathering ramps across the overlap. Multi-band blends each frequency band separately. Seam finding cuts along the least visible path.",
steps:["Compute the overlap region.","Feathering: linear alpha ramp.","Multi-band: Laplacian pyramid of each image, per-band weighted blend, reconstruct.","Seam finding: cost = difference, shortest path."],
pseudo:`Feathering:
alpha = distance to the edge / overlap width
out = alpha * A + (1 - alpha) * B

Multi-band blending:
build Laplacian pyramids of A and B (L levels)
build a Gaussian pyramid of the mask
blend each level: L_A * G + L_B * (1 - G)
reconstruct from the blended pyramid

Seam finding (min-cost path):
cost(p) = |A(p) - B(p)|
dynamic programming top to bottom
use the seam as the cut between A and B

Exposure compensation:
gain least squares over overlaps, gamma,
histogram matching`,

{id:"lucas-kanade",title:"Lucas-Kanade optical flow",level:4,kind:"Motion",status:"Runnable teaching lab",
summary:"Lucas-Kanade estimates the displacement of small patches between two frames. It assumes constant brightness and small motion, and solves a 2x2 least squares per patch.",
mental:"Track a small window from frame to frame",
mentalText:"The brightness constancy constraint gives one equation per pixel. A window gives more equations than unknowns, so it is solvable.",
steps:["Compute spatial gradients Ix, Iy.","Compute temporal gradient It.","Assemble the structure tensor per patch.","Solve for (u, v).","Use pyramids for large motion."],
pseudo:`Brightness constancy:
I(x + u, y + v, t + 1) = I(x, y, t)
Taylor expand: Ix u + Iy v + It = 0

Aperture problem:
one equation, two unknowns
use a window to get more equations

Lucas-Kanade:
A = [Ix(p) Iy(p)] for p in window
b = -It(p)
solve (A^T A) [u v] = A^T b
A^T A = structure tensor

Solvability:
both eigenvalues large (corner-like patch)

Pyramidal LK:
coarse estimate, warp, refine at finer levels

Iterative refinement:
warp I2 by current (u, v), compute residual, update`,

strength:"Fast, accurate for small motion. Simple to implement.",
limits:"Only small motion. Fails at boundaries and textureless regions.",
pitfall:"Running LK on a single scale. Large motion breaks the linear assumption. Use pyramids.",
question:"Why does Lucas-Kanade need a window?",
answer:"The aperture problem means each pixel gives one equation with two unknowns. A window adds more equations so the system is solvable.",

summary:"Horn-Schunck computes dense optical flow by minimising brightness constancy plus a smoothness term. It is variational and produces a flow field for every pixel.",

{id:"stereo-sgbm",title:"Stereo matching and semi-global matching",level:5,kind:"Depth",status:"Runnable teaching lab",
summary:"Stereo matching finds corresponding points in a rectified stereo pair. The disparity gives depth. Semi-global matching (SGM) aggregates costs along multiple 1D paths.",
mental:"Find the same point in the left and right images",
mentalText:"After rectification, the epipolar lines are horizontal. Matching reduces to a 1D search. Disparity d gives depth Z = f B / d.",
steps:["Rectify the stereo pair.","Compute per-pixel matching costs (Census, MI, SAD).","Aggregate costs along paths (SGM).","Pick the minimum-cost disparity.","Refine with subpixel and consistency checks."],
pseudo:`Rectification:
epipolar lines become horizontal

Disparity and depth:
d = x_left - x_right
Z = f * B / d

Cost:
SAD, Census (Hamming), mutual information

SGM:
for each direction r:
  L_r(p, d) = C(p, d) + min(
    L_r(p-r, d),
    L_r(p-r, d±1) + P1,
    min_k L_r(p-r, k) + P2
  ) - min_k L_r(p-r, k)
S(p, d) = sum_r L_r(p, d)
d*(p) = argmin_d S(p, d)

Consistency check:
d_L(p) == d_R(p - d_L(p)), else occluded

Subpixel: parabolic fit around the minimum
Modern: PSMNet, RAFT-Stereo, CREStereo`,

strength:"SGM is accurate and efficient. Global-ish aggregation without a full MRF solve.",

{id:"wiener-richardson",title:"Wiener and Richardson-Lucy deconvolution",level:5,kind:"Restoration",status:"Runnable teaching lab",demoTitle:"Richardson–Lucy lab",
summary:"Deconvolution recovers a sharp image from a blurry one. Wiener filtering is optimal for Gaussian noise in the frequency domain. Richardson-Lucy is an iterative maximum-likelihood method for Poisson noise.",
mental:"Undo the blur with knowledge of the PSF",
mentalText:"Blur is convolution with a point spread function. Deconvolution inverts this. Noise makes it ill-posed, so regularisation is needed.",
steps:["Estimate the PSF.","Wiener: compute the frequency-domain filter.","Richardson-Lucy: iterate the multiplicative update.","Regularise to control noise."],
pseudo:`Wiener filter:
G(u, v) = H*(u, v) / (|H(u, v)|^2 + K)
F_hat = G * F
K = noise-to-signal ratio

Richardson-Lucy:
u_{t+1} = u_t * ( (d / (u_t * h)) * h_flipped )
d = observed, h = PSF, * = convolution
converges to the ML estimate under Poisson noise

Blind deconvolution:
estimate PSF and image jointly

Regularisation:
Wiener + Tikhonov, RL + TV, early stopping

Applications:
microscopy, astronomy, medical imaging,
motion deblurring`,

{id:"inpainting-poisson-seam",title:"Inpainting, Poisson blending and seam carving",level:4,kind:"Editing",status:"Runnable teaching lab",demoTitle:"Inpainting + seam carving lab",
summary:"Inpainting fills missing regions using surrounding information. Poisson blending matches gradients for seamless compositing. Seam carving resizes images by removing low-energy paths.",
mental:"Fill holes, blend seamlessly, remove seams",
mentalText:"Inpainting propagates structure and texture into the hole. Poisson solves for a new image whose gradients match the source. Seam carving removes paths of least energy.",

pseudo:`Inpainting (diffusion):
iterative smoothing into the hole
PatchMatch: find similar patches and copy

Poisson blending:
minimise ||grad f - grad g||^2 over the region
with f = target on the boundary
div(grad f) = div(grad g)

Seam carving:
energy E(p) = |grad I(p)|
dynamic programming: min-cost path top to bottom
remove the seam, update the energy, repeat

Forward energy:
include the cost of new edges created by removal

Applications:
object removal, content-aware resizing,
panorama blending`,

{id:"hdr-tone",title:"HDR and tone mapping",level:4,kind:"Pipeline",status:"Runnable teaching lab",demoTitle:"HDR merge + tone mapping lab",
summary:"HDR imaging combines multiple exposures into a single high-dynamic-range image. Tone mapping compresses the range for display while preserving appearance.",

pseudo:`Camera response:
Z_ij = f(E_i * t_j)
g(Z_ij) = ln E_i + ln t_j
solve for g (Debevec-Malik)

global: Reinhard, Drago, Filmic
local: bilateral, gradient domain

Reinhard global:  L_d = L / (1 + L)
Reinhard scaled: L_d = L (1 + L/L_white^2) / (1 + L)

Gradient domain (Fattal):
attenuate large gradients, solve Poisson

Filmic (ACES): smooth highlight rolloff
Local tone mapping: detail enhancement, halo control`,

summary:"Resampling changes the sampling grid of an image. The kernel trades sharpness against ringing. Bilinear is fast and smooth. Bicubic is sharper. Lanczos is sharpest but rings.",

nearest:  box, blocky
bilinear: tent, smooth
bicubic:  cubic, sharper

out[x] = sum_k in[k] K(x - k * scale)

Separable:
resample rows, then columns

Downsampling:
scale the kernel support by the downsample factor
otherwise aliasing

bilinear: support 1, C0

Lanczos-3: support 3, oscillatory

learned upsamplers (EDSR, SwinIR)

summary:"Median stacking averages aligned frames to remove transient objects and reduce noise. Drizzle combines undersampled frames onto a finer grid, recovering resolution.",
mental:"Stack many frames to see the faint signal",
mentalText:"Median stacking rejects outliers. Drizzle maps each input pixel to a smaller output pixel, trading sampling for resolution.",
steps:["Align the frames.","Median stack: pixel-wise median.","Drizzle: shrink each input pixel, drop onto a finer output grid.","Iterate over frames.","Deconvolve the result."],
pseudo:`Median stacking:
out[p] = median_i in_i[p]
removes transient objects (satellites, cosmic rays)

Mean stacking:
out[p] = mean_i in_i[p]
noise falls by sqrt(N) for Gaussian noise

Sigma-clipped mean:
discard values outside a sigma range, then average

Drizzle:
shrink each input pixel (pixfrac)
map to the output grid with the frame transform
accumulate weighted, divide by the weight map

Parameters:
pixfrac (0..1), scale (output/input pixel ratio)

Applications:
Hubble and JWST imaging, astrophotography,
video super-resolution

Tips:
align with subpixel accuracy, weight by exposure,
reject outliers before averaging`,

"nerf":`import numpy as np

# The volume-rendering integral along one ray (no learning):
N = 64
t = (np.arange(N) + 0.5) / N
delta = 1.0 / N
sigma = 1.2 * np.exp(-((t - 0.35) / 0.08) ** 2) \\
      + 0.8 * np.exp(-((t - 0.70) / 0.10) ** 2)
c1 = np.array([0.96, 0.62, 0.04])
c2 = np.array([0.20, 0.73, 0.51])
w1 = np.exp(-((t - 0.35) / 0.08) ** 2)
w2 = np.exp(-((t - 0.70) / 0.10) ** 2)
colors = (w1[:, None] * c1 + w2[:, None] * c2) / (w1 + w2 + 1e-9)[:, None]
alpha_i = 1 - np.exp(-sigma * delta)
T = np.exp(-np.concatenate([[0], np.cumsum(sigma * delta)[:-1]]))
weights = T * alpha_i
C = (weights[:, None] * colors).sum(axis=0)
print("accumulated opacity:", weights.sum())
print("pixel colour:", C.round(3))

function demoInpainting(text){

const cx=W/2,cy=H/2;

const i=y*W+x;

}
let cur=new Float32Array(g),cw=W;
const firstSeam=[];
for(let s=0;s<seams&&cw>8;s++){

const dp=new Float32Array(cw*H),from=new Int32Array(cw*H);
for(let x=0;x<cw;x++)dp[x]=mag[x];
for(let y=1;y<H;y++)for(let x=0;x<cw;x++){
let best=dp[(y-1)*cw+x],bx=x;
for(const dx of [-1,1]){const xx=x+dx;if(xx>=0&&xx<cw&&dp[(y-1)*cw+xx]<best){best=dp[(y-1)*cw+xx];bx=xx;}}
dp[y*cw+x]=mag[y*cw+x]+best;from[y*cw+x]=bx;
}
let sx=0;for(let x=1;x<cw;x++)if(dp[(H-1)*cw+x]<dp[(H-1)*cw+sx])sx=x;
const path=new Array(H);
for(let y=H-1;y>=0;y--){path[y]=sx;sx=from[y*cw+sx];}
if(s===0)for(let y=0;y<H;y++)firstSeam.push(path[y]);
const next=new Float32Array((cw-1)*H);
for(let y=0;y<H;y++){
let j=0;
for(let x=0;x<cw;x++){if(x===path[y])continue;next[y*(cw-1)+j]=cur[y*cw+x];j++;}
}
cur=next;cw--;
}

firstSeam.forEach((x,y)=>{seamVis[y*W+x]=255;});

encoded:`Hole radius ${maskR}px · 120 diffusion iterations

function demoDemosaic(text){
const n=numsOf(text);

const {canvas,id,W,H}=getImage(140,110);
const data=id.data;

for(let y=0;y<H;y++)for(let x=0;x<W;x++){
const i=y*W+x;

}
const getC=(x,y,c)=>{
if(x<0||x>=W||y<0||y>=H)return 0;
const i=y*W+x;
if(c==='R')return (y%2===0&&x%2===0)?mosaic[i]:0;
if(c==='G')return ((y%2===1&&x%2===0)||(y%2===0&&x%2===1))?mosaic[i]:0;

};
const rgb=new Float32Array(W*H*3);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
const i=y*W+x;let r,gg,b;
if(y%2===0&&x%2===0){r=mosaic[i];gg=(getC(x-1,y,'G')+getC(x+1,y,'G')+getC(x,y-1,'G')+getC(x,y+1,'G'))/4;b=(getC(x-1,y-1,'B')+getC(x+1,y-1,'B')+getC(x-1,y+1,'B')+getC(x+1,y+1,'B'))/4;}
else if(y%2===1&&x%2===1){b=mosaic[i];gg=(getC(x-1,y,'G')+getC(x+1,y,'G')+getC(x,y-1,'G')+getC(x,y+1,'G'))/4;r=(getC(x-1,y-1,'R')+getC(x+1,y-1,'R')+getC(x-1,y+1,'R')+getC(x+1,y+1,'R'))/4;}
else{gg=mosaic[i];
if(y%2===0){r=(getC(x-1,y,'R')+getC(x+1,y,'R'))/2;b=(getC(x,y-1,'B')+getC(x,y+1,'B'))/2;}
else{r=(getC(x,y-1,'R')+getC(x,y+1,'R'))/2;b=(getC(x-1,y,'B')+getC(x+1,y,'B'))/2;}}
rgb[i*3]=r;rgb[i*3+1]=gg;rgb[i*3+2]=b;
}
let mr=0,mg=0,mb=0;
for(let i=0;i<W*H;i++){mr+=rgb[i*3];mg+=rgb[i*3+1];mb+=rgb[i*3+2];}
mr/=W*H;mg/=W*H;mb/=W*H;
const avg=(mr+mg+mb)/3;
const gwR=avg/mr,gwB=avg/mb;
const manual=rgbCanvas(W,H,i=>[Math.min(255,rgb[i*3]*gainR),rgb[i*3+1],Math.min(255,rgb[i*3+2]*gainB)]);
const auto=rgbCanvas(W,H,i=>[Math.min(255,rgb[i*3]*gwR),rgb[i*3+1],Math.min(255,rgb[i*3+2]*gwB)]);
const mosaicVis=rgbCanvas(W,H,i=>{
const x=i%W,y=Math.floor(i/W);
if(y%2===0&&x%2===0)return [mosaic[i],0,0];
if(y%2===1&&x%2===1)return [0,0,mosaic[i]];
return [0,mosaic[i],0];
});
return {
html:imgRow(imgTag(canvas,'Original RGB'),imgTag(mosaicVis,'Bayer RGGB mosaic'),imgTag(manual,`Manual WB R=${gainR}, B=${gainB}`),imgTag(auto,'Grey-world auto WB')),
encoded:`Bayer RGGB · bilinear demosaic
Manual gains: R ${gainR} · B ${gainB}
Grey-world gains: R ${fmtNum(gwR,3)} · B ${fmtNum(gwB,3)} (G = 1)
Channel means after demosaic: R ${fmtNum(mr,1)} · G ${fmtNum(mg,1)} · B ${fmtNum(mb,1)}
Bilinear demosaic causes zipper/false colour at edges; Malvar or edge-directed methods do better.`,
decoded:'Each sensor pixel captures one colour. Demosaicing interpolates the missing two, which misaligns channels at sharp edges. White balance multiplies channels to neutralise the illuminant; grey-world assumes the scene average is neutral.'};
}
function demoHdr(text){
const n=numsOf(text);
const key=clampNum(n[0],0.18,0.05,0.5),gamma=clampNum(n[1],1,0.5,2.2);
const {id,W,H}=getImage(140,110);
const {g}=toGray(id);
const L=new Float32Array(W*H);
for(let i=0;i<W*H;i++)L[i]=(g[i]/255)*2+0.01;
const times=[0.25,1,4];
const exposures=times.map(t=>{
const z=new Float32Array(W*H);
for(let i=0;i<W*H;i++)z[i]=Math.min(255,255*Math.pow(L[i]*t,1/2.2));
return z;
});
const E=new Float32Array(W*H);
let clipped=0;
for(let i=0;i<W*H;i++){
let ws=0,vs=0;
exposures.forEach((z,j)=>{
const w=Math.max(0.02,Math.min(z[i],255-z[i])/128);
const lin=Math.pow(z[i]/255,2.2)/times[j];
ws+=w;vs+=w*lin;
if(z[i]<=1||z[i]>=254)clipped++;
});
E[i]=vs/ws;
}
const logAvg=Math.exp(mean(Array.from(E,v=>Math.log(Math.max(1e-6,v)))));
const Lwhite=Math.max(...E);
const tone=new Float32Array(W*H);
for(let i=0;i<W*H;i++){
const Ls=key/Math.max(1e-6,logAvg)*E[i];
const Ld=Ls*(1+Ls/(Lwhite*Lwhite))/(1+Ls);
tone[i]=Math.min(255,255*Math.pow(Math.max(0,Ld),1/gamma));

return {
html:imgRow(imgTag(grayToImage(exposures[0],W,H),'t = 0.25 (under)'),imgTag(grayToImage(exposures[1],W,H),'t = 1 (mid)'),imgTag(grayToImage(exposures[2],W,H),'t = 4 (over)'),imgTag(grayToImage(tone,W,H),`Reinhard + gamma ${gamma}`)),
encoded:`Scene radiance 0.01–2.01 · exposures t = 0.25, 1, 4 · response gamma 2.2 (known)
Merge: E = Σ w(Z)·(Z/255)^2.2 / t / Σ w(Z), hat weights.
Clipped samples across exposures: ${clipped} of ${3*W*H}
Log-average radiance ${fmtNum(logAvg,4)} · key ${key} · L_white ${fmtNum(Lwhite,3)}
Tone: L_d = L(1 + L/L_white²)/(1 + L), then display gamma.`,
decoded:'Each exposure captures a different slice of the range. Inverting the known response and weighting well-exposed pixels reconstructs radiance. Reinhard compresses it for display; the key sets overall brightness. Real pipelines estimate the response (Debevec–Malik).'};
}

function demoStacking(text){

const noise=clampNum(n[1],15,1,40);

html:imgRow(imgTag(grayToImage(frames[0],W,H),'Frame 1 (noisy)'),imgTag(grayToImage(meanImg,W,H),'Mean stack'),imgTag(grayToImage(medianImg,W,H),'Median stack'),imgTag(grayToImage(clipImg,W,H),`σ-clipped mean (${clipSig}σ)`)),

PSNR vs clean:
  single frame ${fmtNum(psnr(g,frames[0]),2)} dB
  mean         ${fmtNum(psnr(g,meanImg),2)} dB

function demoNerf(text){
const n=numsOf(text);
const N=clampInt(n[0],64,16,256),scale=clampNum(n[1],1,0.2,3);
const delta=1/N;
const ts=[],sig=[],Tarr=[],warr=[];

let T=1,C=[0,0,0],alphaSum=0;
for(let i=0;i<N;i++){

const g1=Math.exp(-((t-0.35)/0.08)**2),g2=Math.exp(-((t-0.70)/0.10)**2);
const s=scale*(1.2*g1+0.8*g2);

const col=[(w1*c1[0]+w2*c2[0])/(w1+w2+1e-9),(w1*c1[1]+w2*c2[1])/(w1+w2+1e-9),(w1*c1[2]+w2*c2[2])/(w1+w2+1e-9)];
const a=1-Math.exp(-s*delta);
const w=T*a;
C[0]+=w*col[0];C[1]+=w*col[1];C[2]+=w*col[2];
alphaSum+=w;
ts.push(t);sig.push(s);Tarr.push(T);warr.push(w);
T*=Math.exp(-s*delta);

const css=`rgb(${Math.round(C[0]*255)},${Math.round(C[1]*255)},${Math.round(C[2]*255)})`;
return {
html:`<div class="img-row"><div class="swatch" style="background:${css}" role="img" aria-label="Composited pixel colour"></div></div>`+linePlot([{x:ts,y:sig,name:'density σ(t)'},{x:ts,y:Tarr,name:'transmittance T(t)'},{x:ts,y:warr,name:'weight T·α'}],{xlab:'t along ray',ylab:'value',label:'Volume rendering terms'}),
encoded:`Ray samples ${N} · density scale ${scale} · analytic two-blob field
C = Σ T_i (1 − exp(−σ_i δ)) c_i,  T_i = exp(−Σ_{j<i} σ_j δ)
Accumulated opacity: ${fmtNum(alphaSum,4)}
Composited colour: (${fmtNum(C[0],3)}, ${fmtNum(C[1],3)}, ${fmtNum(C[2],3)})
Final transmittance: ${fmtNum(T,4)}
No learned network — this isolates the rendering integral NeRF uses.`,
decoded:'Density tells how much light a sample absorbs; transmittance tells how much light reaches it; the weight is their product. The first blob occludes the second — that is occlusion emerging from the integral. NeRF learns σ and c with an MLP; Gaussian splatting rasterises explicit primitives instead.'};
}

function adoptData(d){
state.completed=new Set((d.completed||[]).filter(id=>byId[id]));
state.bookmarks=new Set((d.bookmarks||[]).filter(id=>byId[id]));
state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';

function confirmAction(msg,fn){openModal('Please confirm','<p>'+esc(msg)+'</p>',[{label:'Cancel'},{label:'Confirm',primary:true,fn}]);}
function showShortcuts(){
const rows=[['/','Focus search'],['t','Cycle theme'],['n / p','Next / previous lesson'],['b','Toggle bookmark'],['m','Toggle completed'],['r','Run the current lab'],['?','This panel'],['Esc','Close dialogs']];
openModal('Keyboard shortcuts',rows.map(r=>`<div class="kbd-row"><span>${esc(r[1])}</span><kbd>${esc(r[0])}</kbd></div>`).join(''),[{label:'Close',primary:true}]);
}
/* ============================================================
   Rendering
   ============================================================ */
const labCount=()=>LESSONS.filter(l=>l.demo&&l.demo!=='none').length;
function getChapter(id){return CHAPTERS.find(c=>c.ids.includes(id))||CHAPTERS[0];}
function progress(){
const n=state.completed.size,t=LESSONS.length,pct=Math.round(n/t*100);
$('#progressText').textContent=`${n} / ${t}`;
$('#progressFill').style.width=pct+'%';
$('#progressBar').setAttribute('aria-valuenow',String(pct));
$('#lessonCount').textContent=t+' lessons';
$('#catalogCount').textContent=`${CHAPTERS.length} chapters · ${t} lessons · ${labCount()} runnable labs · everything local`;
}
function renderTree(){
const q=$('#searchInput').value.toLowerCase().trim();
const ch=$('#chapterFilter').value;
const bm=$('#bmOnly').checked;
const root=$('#courseTree');root.textContent='';
for(const c of CHAPTERS){
if(ch!=='all'&&c.id!==ch)continue;
const rows=c.ids.map(id=>byId[id]).filter(l=>l
&&(!bm||state.bookmarks.has(l.id))
&&(!q||(l.title+' '+l.summary+' '+l.kind+' '+c.title).toLowerCase().includes(q)));
if(!rows.length)continue;
const group=document.createElement('section');
const label=document.createElement('div');label.className='group-label';
label.innerHTML=`<span>${esc(c.title)}</span><span>${rows.length}</span>`;
group.appendChild(label);
rows.forEach(l=>{
const b=document.createElement('button');b.type='button';
b.className='link'+(state.current===l.id?' active':'');
b.dataset.lesson=l.id;
b.innerHTML=`<span class="num">${String(LESSONS.indexOf(l)+1).padStart(2,'0')}</span><span class="name">${esc(l.title)}</span>${state.bookmarks.has(l.id)?'<span class="bm" aria-label="bookmarked">★</span>':''}${state.completed.has(l.id)?'<span class="done" aria-label="completed">✓</span>':''}`;
group.appendChild(b);
});
root.appendChild(group);
}
if(!root.children.length){const p=document.createElement('p');p.className='muted';p.textContent='No matching lessons. Try another search or filter.';root.appendChild(p);}
progress();
}
const listToHTML=a=>`<ol class="steps">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
const refsHTML=r=>r&&r.length?`<div class="references">${r.map(x=>`<a target="_blank" rel="noopener noreferrer" href="${esc(x[1])}">${esc(x[0])} ↗</a>`).join('')}</div>`:'<p class="muted">See the recommended textbooks and papers for a full treatment.</p>';
function codeText(l){
const c=CODE[l.demo];
if(c)return c;
return '# CONCEPT OUTLINE, NOT EXECUTABLE PYTHON\n# Lesson: '+l.title+'\n\n# Core idea\n# '+String(l.summary||'').replace(/\n/g,'\n# ')+'\n\n# Pseudocode from the lesson\n'+String(l.pseudo||'').split('\n').map(x=>'# '+x).join('\n')+'\n';
}
const statusClass=l=>/Runnable/.test(l.status)?'good':'warn';
function renderLesson(id){
const l=byId[id];if(!l){renderHome();return;}
state.page='lesson';state.current=id;
const c=getChapter(id),index=LESSONS.indexOf(l);
const next=LESSONS[(index+1)%LESSONS.length],prev=LESSONS[(index-1+LESSONS.length)%LESSONS.length];
const hasDemo=l.demo&&l.demo!=='none';
const labDraft=state.labDrafts[id]!==undefined?state.labDrafts[id]:(l.sample||'');
const demoArea=hasDemo?`<section class="panel"><div class="panel-head"><h2>${esc(l.demoTitle||'Interactive teaching lab')}</h2><p>Runs entirely in your browser with plain JavaScript and Canvas 2D. Small, honest teaching implementations — not a production vision pipeline. Randomized steps use the seed below, so results are reproducible.</p></div><div class="body"><div class="lab-top"><label for="labInput">Input</label><label for="labSeed">Seed</label><input class="seed" id="labSeed" type="number" min="0" max="999999" value="${state.seed}" aria-label="Random seed"><button class="btn" id="resetSample" type="button">Reset sample</button><button class="btn primary" id="runLab" type="button">Run lab</button></div><textarea class="lab-input" id="labInput" aria-label="Lab input" spellcheck="false">${esc(labDraft)}</textarea><div class="notice info"><strong>Format:</strong> ${esc(l.fmt)}</div><div class="lab-plot" id="labPlot" hidden></div><div class="lab-cols"><div><div class="label">Output</div><div class="lab-output" id="labEncoded">Run the lab to see output.</div></div><div><div class="label">What to notice</div><div class="lab-output" id="labDecoded">Step notes appear here.</div></div></div><div class="lab-status" id="labStatus" role="status" aria-live="polite"></div></div></section>`:'';
const code=state.drafts[id]!==undefined?state.drafts[id]:codeText(l);
const hasCode=!!CODE[l.demo];
$('#mainView').innerHTML=`<div class="breadcrumb">vision lab / ${esc(c.title)}</div>
<header class="header">
<div class="eyebrow">Lesson ${String(index+1).padStart(2,'0')} · ${esc(l.kind)}</div>
<h1>${esc(l.title)}</h1>
<p>${esc(l.summary)}</p>
<div class="tags"><span class="tag">Level ${l.level}</span><span class="tag ${statusClass(l)}">${esc(l.status)}</span><span class="tag">${esc(c.title.replace(/^\d+\.\s*/,''))}</span></div>
<div class="header-actions">
<button class="btn" id="bookmarkBtn" type="button">${state.bookmarks.has(id)?'★ Bookmarked':'☆ Bookmark'}</button>
<button class="btn primary" id="completeBtn" type="button">${state.completed.has(id)?'✓ Completed':'Mark complete'}</button>
</div>
</header>
<section class="panel"><div class="panel-head"><h2>1. Understand the idea</h2><p>Plain language and a mental picture</p></div><div class="body idea"><div><p>${esc(l.summary)}</p><p><strong>What problem it solves:</strong> ${esc(l.problem)}</p><div class="takeaway"><strong>Takeaway:</strong> ${esc(l.output)}</div></div><aside class="mental"><small>Mental picture</small><strong>${esc(l.mental)}</strong><p>${esc(l.mentalText)}</p></aside></div></section>
<section class="panel"><div class="panel-head"><h2>2. Input and output</h2><p>Know what goes in and what comes out</p></div><div class="body two"><div class="mini"><h3>Input</h3><p>${esc(l.input)}</p></div><div class="mini"><h3>Output</h3><p>${esc(l.output)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>3. How it works</h2><p>Step by step, with the key rule that makes it correct</p></div><div class="body two"><div>${listToHTML(l.steps)}<div class="takeaway" style="margin-top:14px"><strong>Key rule:</strong> ${esc(l.invariant)}</div></div><pre class="pseudo">${esc(l.pseudo)}</pre></div><div class="table-wrap"><table><thead><tr><th>Step</th><th>What happens</th><th>Why it matters</th></tr></thead><tbody>${l.trace.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
${demoArea}
<section class="panel"><div class="panel-head"><h2>4. Cost and behavior</h2><p>Costs depend on image size, kernel size and hardware. These are scope labels, not benchmarks.</p></div><div class="body"><div class="tiles">${l.complexity.map((x,i)=>`<div class="tile"><span>${['Time','Memory','Interpretation'][i]}</span><strong>${esc(x.split(' ').slice(0,2).join(' '))}</strong><small>${esc(x)}</small></div>`).join('')}</div><div class="two" style="margin-top:12px"><div class="mini"><h3>Strengths</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>Limits</h3><p>${esc(l.limits)}</p></div></div></div></section>
<section class="panel"><div class="panel-head"><h2>5. Code and usage</h2><p>Reference code is for learning. Real vision should use vetted libraries.</p></div><div class="code-head"><div><span class="tag">${hasCode?'Python example':'Concept outline, not executable'}</span> <span class="tag">Editable</span></div><div class="header-actions" style="margin:0"><button class="btn" id="copyCode" type="button">Copy code</button><button class="btn" id="downloadCode" type="button">Download</button></div></div><textarea id="codeEditor" class="code-editor" spellcheck="false" aria-label="Editable Python code">${esc(code)}</textarea><div class="code-foot"><span>${hasCode?'Reference example. The in-page lab runs its own JavaScript implementation.':'Lesson-specific outline, not an implementation.'}</span><span id="codeStatus">Local draft</span></div><div class="body"><div class="mini"><h3>Where it is used</h3><p>${esc(l.uses)}</p></div><div class="notice" style="margin-top:12px"><strong>Common pitfall:</strong> ${esc(l.pitfall)}</div></div></section>
<section class="panel"><div class="panel-head"><h2>6. Choices and alternatives</h2><p>Pick based on the data, constraints and the guarantee you need</p></div><div class="body two"><div class="mini"><h3>When to use this</h3><p>${esc(l.strength)}</p></div><div class="mini"><h3>When to use something else</h3><p>${esc(l.limits)}</p></div></div></section>
<section class="panel"><div class="panel-head"><h2>7. Check yourself</h2><p>Try to answer before you open the explanation</p></div><div class="body"><details class="practice"><summary>${esc(l.question)}</summary><p>${esc(l.answer)}</p></details></div></section>
<section class="panel"><div class="panel-head"><h2>8. References</h2><p>Standard references for this topic</p></div><div class="body">${refsHTML(l.refs)}<p class="muted" style="font-size:11px;margin-top:12px">The labs on this page are teaching implementations. For production work use OpenCV, scikit-image, PIL/Pillow, PyTorch, COLMAP, OpenMVG, OpenMVS, or another vetted library.</p></div></section>
<footer class="footer"><span>Runs entirely in your browser · progress stored locally · no network calls</span><span>Lesson ${index+1} of ${LESSONS.length}</span><span><button class="btn" id="prevLesson" type="button">← Prev</button> <button class="btn" id="nextLesson" type="button">Next →</button></span></footer>`;
$('#bookmarkBtn').onclick=()=>{state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);save();renderLesson(id);toast(state.bookmarks.has(id)?'Bookmarked':'Bookmark removed');};
$('#completeBtn').onclick=()=>{state.completed.has(id)?state.completed.delete(id):state.completed.add(id);save();renderLesson(id);toast(state.completed.has(id)?'Lesson completed':'Completion removed');};
$('#nextLesson').onclick=()=>openLesson(next.id);
$('#prevLesson').onclick=()=>openLesson(prev.id);
$('#copyCode').onclick=()=>{
const v=$('#codeEditor').value;
const fallback=()=>{const ta=$('#codeEditor');ta.select();try{document.execCommand('copy');toast('Code copied');}catch(e){toast('Copy failed');}};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(()=>toast('Code copied'),fallback);
else fallback();
};
$('#downloadCode').onclick=()=>downloadText(`${id}.${hasCode?'py':'txt'}`,$('#codeEditor').value,hasCode?'text/x-python':'text/plain');
$('#codeEditor').addEventListener('input',()=>{state.drafts[id]=$('#codeEditor').value;save();$('#codeStatus').textContent='Draft saved locally';});
if(hasDemo){
$('#runLab').onclick=()=>runLab(l);
$('#labSeed').addEventListener('change',()=>{state.seed=clampInt($('#labSeed').value,42,0,999999);save();});
$('#labInput').addEventListener('input',()=>{state.labDrafts[id]=$('#labInput').value.slice(0,20000);save();});
$('#resetSample').onclick=()=>{
$('#labInput').value=l.sample||'';delete state.labDrafts[id];save();
$('#labPlot').hidden=true;$('#labPlot').innerHTML='';
$('#labEncoded').textContent='Run the lab to see output.';
$('#labDecoded').textContent='Step notes appear here.';
$('#labStatus').textContent='';
toast('Sample restored');
};
runLab(l,true);
}
renderTree();save();
if(location.hash!==`#${id}`)history.replaceState(null,'',`#${id}`);
}
function renderHome(){
state.page='home';
$('#mainView').innerHTML=`<div class="home-hero"><div class="eyebrow">aznur · engineering toolbook</div><h1>Understand image processing and computer vision from pixels to volume rendering.</h1><p>A beginner-friendly course covering image representation, filters, edges, segmentation, morphology, features, geometry, stitching, motion, depth, 3D reconstruction, restoration and modern imaging pipelines. Every lesson has a plain explanation, and ${labCount()} of ${LESSONS.length} lessons have a runnable lab that executes entirely in your browser on a locally generated test scene.</p><div class="header-actions" style="margin:0"><button class="btn primary" id="startFirst" type="button">Start at image representation</button><button class="btn" id="resumeLesson" type="button">Continue lesson</button></div></div>
<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${labCount()}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One file covers the whole curriculum. Production vision systems are a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Histograms and colour-space conversion, true naive vs prefitered sampling, box/Gaussian/sharpen/Laplacian convolution, bilateral filtering, unsharp masking, Sobel/Prewitt/Laplacian, full Canny with BFS hysteresis, Harris and Shi-Tomasi corners, Otsu and adaptive thresholding, 4/8-connected components, morphology, real non-local means, Chambolle TV denoising + CLAHE, FAST-9 with wrap-around contiguity and orientation, Hough lines, a real DLT homography solve, pinhole projection, seeded RANSAC, feather/multi-band/seam blending, Lucas-Kanade and Horn-Schunck flow with quiver plots, stereo SAD matching, Richardson-Lucy deconvolution, nearest/bilinear/bicubic/Lanczos-3 super-resolution and resampling with PSNR, diffusion inpainting plus DP seam carving, Bayer demosaicing with grey-world white balance, a real radiance HDR merge with Reinhard tone mapping, mean/median/sigma-clipped stacking, and the exact volume-rendering integral behind NeRF.</p></div><div class="mini"><h3>What does not run here</h3><p>SIFT/SURF matching, watershed/GrabCut, full panorama stitching, bundle adjustment, SfM/MVS/meshing (COLMAP-scale pipelines), BM3D, SGM path aggregation, Wiener filtering (needs an FFT), drizzle, Poisson blending, and any learned model (SuperPoint, RAFT, EDSR, NeRF training, Gaussian splatting optimisation). Those need vetted libraries and real compute. Use OpenCV, scikit-image, PyTorch, COLMAP, OpenMVG or OpenMVS for production work.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from image representation to neural rendering.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" type="button" data-chapter="${esc(c.id)}"><span class="num">Chapter ${String(i+1).padStart(2,'0')} · ${c.ids.length} lessons</span><strong>${esc(c.title.replace(/^\d+\.\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>aznur / vision lab</span><span>Single file · no external runtime dependencies · your data never leaves this device</span></footer>`;
$('#startFirst').onclick=()=>openLesson('image-rep');
$('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'image-rep');
$('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0]);});
if(location.hash!=='#home')history.replaceState(null,'','#home');
}
function renderProgressPage(){
state.page='progress';
const linkList=ids=>ids.length?`<div class="references">${ids.map(id=>`<a href="#${esc(id)}" data-open="${esc(id)}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">Nothing here yet.</p>';
$('#mainView').innerHTML=`<div class="breadcrumb">vision lab / Bookmarks &amp; progress</div><header class="header"><div class="eyebrow">Local only</div><h1>Bookmarks and progress</h1><p>Everything stays in this browser's localStorage: completion marks, bookmarks, theme, the last lesson, code drafts, lab inputs and the seed. Export the JSON to move it or keep a backup. Nothing is sent anywhere.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons (${state.completed.size})</h2></div><div class="body">${linkList([...state.completed])}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks (${state.bookmarks.size})</h2></div><div class="body">${linkList([...state.bookmarks])}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress" type="button">Export progress JSON</button><button class="btn" id="clearCompleted" type="button">Clear completion marks</button><button class="btn" id="clearBookmarks" type="button">Clear bookmarks</button><button class="btn" id="clearDrafts" type="button">Clear code &amp; lab drafts</button><button class="btn" id="clearAll" type="button">Clear all local data</button></div><p class="muted" style="font-size:11.5px;margin-top:12px">Import accepts only known lesson IDs and schema version 1 or 2, with size limits.</p></div></section>`;
$('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open);});
$('#exportProgress').onclick=exportProgress;
$('#clearCompleted').onclick=()=>confirmAction('Clear all completion marks?',()=>{state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared');});
$('#clearBookmarks').onclick=()=>confirmAction('Clear all bookmarks?',()=>{state.bookmarks.clear();save();renderProgressPage();renderTree();toast('Bookmarks cleared');});
$('#clearDrafts').onclick=()=>confirmAction('Clear all saved code and lab-input drafts?',()=>{state.drafts={};state.labDrafts={};save();toast('Drafts cleared');});
$('#clearAll').onclick=()=>confirmAction('Clear ALL local data (progress, bookmarks, drafts, theme, seed)?',()=>{state.completed.clear();state.bookmarks.clear();state.drafts={};state.labDrafts={};state.current=null;state.theme='system';state.seed=42;try{localStorage.removeItem(KEY);localStorage.removeItem(OLDKEY);}catch(e){}applyTheme();renderProgressPage();renderTree();toast('All local data cleared');});
history.replaceState(null,'','#progress');
}
function openLesson(id){if(!byId[id])return;renderLesson(id);$('#mainView').focus({preventScroll:true});window.scrollTo(0,0);}
function downloadText(name,text,type='text/plain'){
const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);
const a=document.createElement('a');a.href=url;a.download=name;
document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(url),800);
}
function exportProgress(){
downloadText('aznur-vision-lab-progress.json',JSON.stringify({schemaVersion:2,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts,labDrafts:state.labDrafts,seed:state.seed},null,2),'application/json');
toast('Progress exported');
}
function importProgressFile(file){
if(file.size>2000000){toast('Import rejected: file too large');return;}
const r=new FileReader();
r.onload=()=>{try{
const d=JSON.parse(r.result);
if(!d||![1,2].includes(d.schemaVersion))throw Error('bad schema');
if(!Array.isArray(d.completed)||!Array.isArray(d.bookmarks))throw Error('bad schema');
if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
adoptData(d);
applyTheme();save();renderTree();
state.current?openLesson(state.current):renderHome();
toast('Progress imported');
}catch(e){toast('Import rejected: invalid progress data');}};
r.readAsText(file);
}
/* ============================================================
   Events and initialization
   ============================================================ */
function bindGlobal(){
$('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save();};
$('#printBtn').onclick=()=>window.print();
$('#exportBtn').onclick=exportProgress;
$('#importBtn').onclick=()=>$('#importFile').click();
$('#shortcutsBtn').onclick=showShortcuts;
$('#importFile').onchange=e=>{if(e.target.files&&e.target.files[0])importProgressFile(e.target.files[0]);e.target.value='';};
$('#searchInput').oninput=renderTree;
$('#chapterFilter').onchange=renderTree;
$('#bmOnly').onchange=renderTree;
$('#homeLink').onclick=e=>{e.preventDefault();renderHome();};
$('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson);};
document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
$('#modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
window.addEventListener('hashchange',()=>{
const h=location.hash.replace(/^#/,'');
if(h&&byId[h]&&state.current!==h)openLesson(h);
else if(h==='home'&&state.page!=='home')renderHome();
else if(h==='progress'&&state.page!=='progress')renderProgressPage();
});
document.addEventListener('keydown',e=>{
if(e.key==='Escape'&&!$('#modalOverlay').hidden){closeModal();return;}
const tag=document.activeElement?document.activeElement.tagName:'';
if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;
if(!$('#modalOverlay').hidden)return;
const k=e.key.toLowerCase();
if(e.key==='/'){e.preventDefault();$('#searchInput').focus();}
else if(e.key==='?'){e.preventDefault();showShortcuts();}
else if(k==='t'){state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';applyTheme();save();toast('Theme: '+state.theme);}
else if(k==='n'&&state.current){const i=LESSONS.indexOf(byId[state.current]);openLesson(LESSONS[(i+1)%LESSONS.length].id);}
else if(k==='p'&&state.current){const i=LESSONS.indexOf(byId[state.current]);openLesson(LESSONS[(i-1+LESSONS.length)%LESSONS.length].id);}
else if(k==='b'&&state.current&&$('#bookmarkBtn'))$('#bookmarkBtn').click();
else if(k==='m'&&state.current&&$('#completeBtn'))$('#completeBtn').click();
else if(k==='r'&&$('#runLab')){e.preventDefault();$('#runLab').click();}
});
}
function init(){
try{
load();
applyTheme();
CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').appendChild(op);});
bindGlobal();
renderTree();
const hash=location.hash.replace(/^#/,'');
if(hash&&byId[hash])renderLesson(hash);
else if(hash==='progress')renderProgressPage();
else if(state.current&&byId[state.current])renderLesson(state.current);
else renderHome();
progress();
}catch(e){
const mv=document.getElementById('mainView');
if(mv){mv.textContent='';const pre=document.createElement('pre');pre.style.color='var(--bad)';pre.textContent='Initialization error: '+String(e&&e.stack||e);mv.appendChild(pre);}
if(window.console)console.error(e);
}
}
init();
})();
</script>
</body>
</html>
